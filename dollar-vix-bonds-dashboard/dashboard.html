<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DXY VIX US10Y Dashboard</title>
<style>
/* â”€â”€ TEMAS: navy (original) | black (ChartFlow) â€” conmutable en la topbar â”€â”€ */
:root{
  --bg:#050614;--panel:#030722;--topbar:#0e0e12;--hover:#252b3a;--surface:#10131d;
  --gridline:rgba(58,63,84,.78);--tick:#303544;--border:#222;
  --text:#d8dcef;--text-hi:#f0f3ff;--text-price:#f7f8ff;
  --dim1:#6d7892;--dim2:#7d879d;--dim3:#8d96aa;--dim4:#66708a;
  --up:#26a69a;--dn:#ef5350;
  --candle-up:#f4f5ff;--candle-dn:#a0a6b8;--candle-dn-fill:rgba(160,166,184,.55);
  --badge-bg:#f2f4fa;--badge-tx:#10131d;
  --logo:#26a69a;--gold:#d9b84f;--gold-t:#f6e08a;--unit-bg:#060a25;
}
[data-theme="black"]{
  --bg:#0D0E0E;--panel:#0D0E0E;--topbar:#141519;--hover:#24262b;--surface:#141519;
  --gridline:rgba(255,255,255,.06);--tick:#2b2c31;--border:rgba(255,255,255,.08);
  --text:#f4f4f5;--text-hi:#f4f4f5;--text-price:#f4f4f5;
  --dim1:#92939a;--dim2:#92939a;--dim3:#92939a;--dim4:#92939a;
  --candle-up:#f4f4f5;--candle-dn:#7a7b82;--candle-dn-fill:rgba(122,123,130,.55);
  --badge-bg:#f4f4f5;--badge-tx:#0D0E0E;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
.topbar{display:flex;align-items:center;justify-content:space-between;background:var(--topbar);border-bottom:1px solid var(--border);padding:0 10px;height:32px;flex-shrink:0}
.logo{font-size:12px;font-weight:700;color:var(--logo);letter-spacing:1px}
.sub{font-size:10px;color:var(--dim1);margin-left:8px}
.right{display:flex;align-items:center;gap:10px;font-size:10px;color:var(--dim2)}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--logo);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
button{background:transparent;border:1px solid var(--tick);color:var(--dim3);font-family:inherit;font-size:10px;padding:3px 9px;border-radius:3px;cursor:pointer}
button:hover{background:var(--hover);color:var(--text)}
#themeBtn{border-color:var(--gold-t);color:var(--gold-t);font-weight:700}
.grid{height:calc(100vh - 32px);display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--tick)}
.panel{position:relative;background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
.head{position:absolute;top:4px;left:8px;right:58px;height:36px;padding:0;z-index:12}
.title{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--text-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.meta{font-size:12px;color:var(--text-hi);font-weight:700;flex:0 0 auto}
.price-row{margin-top:2px;display:flex;gap:8px;align-items:center;font-size:12px;font-weight:700}
.price{color:var(--text-price)}
.chg.up{color:var(--up)}.chg.dn{color:var(--dn)}
.tick-time{font-size:9px;color:var(--dim4);margin-left:2px}
.unit{position:absolute;top:4px;right:8px;z-index:13;border:1px solid var(--gold);color:var(--gold-t);border-radius:3px;padding:4px 7px;font-size:10px;font-weight:700;line-height:1;background:var(--unit-bg)}
.chart{position:relative;flex:1;overflow:hidden}
canvas.main{position:absolute;top:0;left:0}
.yaxis{position:absolute;top:0;right:0;bottom:28px;width:70px;background:var(--panel);border-left:1px solid var(--tick)}
.xaxis{position:absolute;left:0;right:70px;bottom:0;height:28px;background:var(--panel);border-top:1px solid var(--tick)}
.hline{position:absolute;left:0;right:70px;height:1px;background:repeating-linear-gradient(90deg,rgba(235,238,250,.58) 0,rgba(235,238,250,.58) 1px,transparent 1px,transparent 4px);display:none;pointer-events:none;z-index:5}
[data-theme="black"] .hline{background:repeating-linear-gradient(90deg,rgba(244,244,245,.5) 0,rgba(244,244,245,.5) 1px,transparent 1px,transparent 4px)}
.badge{position:absolute;right:8px;width:58px;transform:translateY(-50%);font-size:9px;font-weight:700;line-height:10px;text-align:center;padding:2px 3px;color:var(--badge-tx);border-radius:2px;display:none;z-index:6}
.badge .cd{display:block;margin-top:1px;font-size:9px;font-weight:400;line-height:10px;color:var(--badge-tx)}
.wm{position:absolute;left:calc(50% - 35px);top:50%;transform:translate(-50%,-50%);text-align:center;opacity:.13;pointer-events:none;z-index:1}
.wm-symbol{font-size:56px;font-weight:800;color:var(--text);letter-spacing:1px}
.wm-label{font-size:24px;color:var(--text);margin-top:8px;max-width:720px}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;flex-direction:column;background:var(--panel);color:var(--dim4);font-size:11px;z-index:20}
.spin{width:15px;height:15px;border:1.5px solid var(--tick);border-top-color:var(--logo);border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:1100px){.grid{grid-template-columns:1fr}.panel{min-height:33.33vh}.wm-symbol{font-size:32px}.wm-label{font-size:13px}}
</style>
</head>
<body>
<div class="topbar">
  <div style="display:flex;align-items:center;gap:8px">
    <span class="logo">DOLLAR MACRO DASHBOARD</span>
    <span class="sub">DXY Â· VIX Â· US10Y Â· <span id="intervalLabel">5 min</span></span>
    <div style="display:flex;gap:2px;margin-left:4px;">
      <button class="interval-btn" data-interval="5m" onclick="switchInterval('5m')" style="background:#FF8C42;color:#fff;border:none;padding:1px 6px;font-size:9px;font-family:inherit;cursor:pointer;border-radius:2px;">5m</button>
      <button class="interval-btn" data-interval="15m" onclick="switchInterval('15m')" style="background:#252630;color:#8a8a95;border:none;padding:1px 6px;font-size:9px;font-family:inherit;cursor:pointer;border-radius:2px;">15m</button>
      <button class="interval-btn" data-interval="30m" onclick="switchInterval('30m')" style="background:#252630;color:#8a8a95;border:none;padding:1px 6px;font-size:9px;font-family:inherit;cursor:pointer;border-radius:2px;">30m</button>
    </div>

</div>
<div id="grid" class="grid"></div>

<script>
// â”€â”€ TEMAS CONMUTABLES: navy (original) | black (ChartFlow) â”€â”€
// Persistido en localStorage; el canvas lee THEME actual
const THEMES = {
  navy:  { grid:"rgba(58,63,84,.78)", tick:"#303544", panel:"#030722",
           candleUp:"#f4f5ff", candleDn:"#a0a6b8", candleDnFill:"rgba(160,166,184,.55)",
           axisTextY:"#e5e9f3", axisTextX:"#858da3", badgeBg:"#f2f4fa", badgeTx:"#10131d" },
  black: { grid:"rgba(255,255,255,.06)", tick:"#2b2c31", panel:"#0D0E0E",
           candleUp:"#f4f4f5", candleDn:"#7a7b82", candleDnFill:"rgba(122,123,130,.55)",
           axisTextY:"#92939a", axisTextX:"#92939a", badgeBg:"#f4f4f5", badgeTx:"#0D0E0E" },
};
let THEME = THEMES[localStorage.getItem("dvb_theme") || "black"] || THEMES.navy;
let CUSTOM_BG = localStorage.getItem("dvb_custom_bg") || "#101014";
THEME = THEME || THEMES.navy;
function themePalette(name){
  const n = name || localStorage.getItem("dvb_theme") || "black";
  if (n === "custom") {
    const base = THEME; // heredada del arranque vÃ¡lido
    return { grid: THEMES.black.grid, tick: THEMES.black.tick, panel: CUSTOM_BG,
             candleUp: THEMES.black.candleUp, candleDn: THEMES.black.candleDn, candleDnFill: THEMES.black.candleDnFill,
             axisTextY: THEMES.black.axisTextY, axisTextX: THEMES.black.axisTextX, badgeBg: THEMES.black.badgeBg, badgeTx: THEMES.black.badgeTx };
  }
  return THEMES[n] || THEMES.navy;
}
function applyTheme(name){
  THEME = themePalette(name);
  if (name === "custom") { THEME.panel = CUSTOM_BG; }
  localStorage.setItem("dvb_theme", name);
  document.documentElement.dataset.theme = name;
  var root = document.documentElement.style;
  root.setProperty("--bg", THEME.panel);
  root.setProperty("--panel", THEME.panel);
  const btn = document.getElementById("themeBtn");
  if(btn) btn.textContent = name === "navy" ? "â— NEGRO" : name === "black" ? "â— AZUL" : "â— TEMA";
  redrawAll();
  closeThemeMenu();
}
function applyCustomBg(hex){
  CUSTOM_BG = hex;
  localStorage.setItem("dvb_custom_bg", hex);
  applyTheme("custom");
}
function closeThemeMenu(){ var m = document.getElementById("bgCtxMenu"); if (m) m.remove(); }
function openThemeMenu(e){
  e.preventDefault(); e.stopPropagation();
  closeThemeMenu();
  var savedTheme = localStorage.getItem("dvb_theme") || "black";
  var m = document.createElement("div");
  m.id = "bgCtxMenu";
  m.style.cssText = "position:fixed;z-index:9999;min-width:210px;background:#141519;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:6px 0;box-shadow:0 10px 30px rgba(0,0,0,.6);font:10px Arial,sans-serif;color:#f4f4f5";
  var title = document.createElement("div");
  title.textContent = "FONDO DE PANTALLA";
  title.style.cssText = "padding:4px 14px 8px;font-weight:700;letter-spacing:.6px;color:#92939a;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:4px";
  m.appendChild(title);
  [["â— Azul Marino","navy"],["â—‹ Negro ChartFlow","black"],["â— Personalizado","custom"]].forEach(function(o){
    var row = document.createElement("div");
    row.textContent = o[0];
    row.style.cssText = "padding:7px 14px;cursor:pointer;white-space:nowrap" + (savedTheme===o[1] ? ";background:rgba(129,140,248,.18);color:#a5b4fc" : "");
    row.onclick = function(){ if (o[1]==="custom") pickCustomBg(); else applyTheme(o[1]); };
    if (o[1]==="custom") {
      var sw = document.createElement("input");
      sw.type = "color";
      sw.value = CUSTOM_BG;
      sw.style.cssText = "width:20px;height:20px;border:1px solid rgba(255,255,255,.2);background:transparent;border-radius:3px;padding:0;margin-left:8px;vertical-align:middle;cursor:pointer";
      sw.oninput = function(){ applyCustomBg(sw.value); };
      sw.onclick = function(ev){ ev.stopPropagation(); };
      row.appendChild(sw);
    }
    m.appendChild(row);
  });
  document.body.appendChild(m);
  m.style.left = Math.min(e.clientX, window.innerWidth - 230) + "px";
  m.style.top = Math.min(e.clientY, window.innerHeight - 150) + "px";
  // Cierre con guarda: clic/touch FUERA del menu lo cierra (dentro no);
  // Escape cierra; NUNCA 'contextmenu' (cerraria el menu recien abierto)
  setTimeout(function(){
    var closer = function (ev) {
      if (m.contains(ev.target)) return;
      document.removeEventListener("mousedown", closer);
      document.removeEventListener("keydown", onMenuItemEsc);
      closeThemeMenu();
    };
    var onMenuItemEsc = function (ev) {
      if (ev.key === "Escape") {
        document.removeEventListener("mousedown", closer);
        document.removeEventListener("keydown", onMenuItemEsc);
        closeThemeMenu();
      }
    };
    document.addEventListener("mousedown", closer);
    document.addEventListener("keydown", onMenuItemEsc);
  }, 0);
}
function pickCustomBg(){
  var inp = document.createElement("input");
  inp.type = "color";
  inp.value = CUSTOM_BG;
  inp.oninput = function(){ applyCustomBg(inp.value); };
  document.body.appendChild(inp);
  inp.click();
  inp.remove();
}
document.addEventListener("contextmenu", openThemeMenu);
function cycleTheme(){
  const cur = localStorage.getItem("dvb_theme") || "black";
  applyTheme(cur === "navy" ? "black" : "navy");
}
// aplicar el tema guardado ANTES del primer render
document.documentElement.dataset.theme = (localStorage.getItem("dvb_theme") || "black");
(function initThemeBtn(){
  const saved = localStorage.getItem("dvb_theme") || "black";
  const btn = document.getElementById("themeBtn");
  if(btn) btn.textContent = saved === "navy" ? "â— NEGRO" : saved === "black" ? "â— AZUL" : "â— TEMA";
})();

const INSTRUMENTS = [
  {key:"DXY", title:"Indice del dolar de EE. UU.", symbol:"DXY", mode:"candles", color:"#f4f5ff", dot:"#26a69a", decimals:3, suffix:"", unit:"USD"},
  {key:"VIX", title:"Indice Volatility S&P 500", symbol:"VIX", mode:"line", color:"#ff334f", dot:"#ef5350", decimals:2, suffix:"", unit:"USD"},
  {key:"US10Y", title:"Rend. bonos deuda publica EE. UU. a 10A", symbol:"US10Y", mode:"heikin", color:"#f4f5ff", dot:"#4c8dff", decimals:3, suffix:"%", unit:"%"}
];

const state = {};
const dragState = {};
const MIN_VISIBLE_BARS = 8;
const MAX_X_ZOOM = 90;
let refreshTimer = null;
let liveTimer = null;
let CURRENT_INTERVAL = "5m";

function view(key){
  if(!state[key]) state[key]={xZoom:7,yZoom:1,targetXZoom:7,targetYZoom:1,xOffset:0,zoomFrame:null,data:null};
  return state[key];
}
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function fitCanvas(canvas, width, height){
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(width * dpr));
  canvas.height = Math.max(1, Math.round(height * dpr));
  canvas.style.width = width + "px";
  canvas.style.height = height + "px";
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return ctx;
}
function fmt(v, inst){ return Number(v).toLocaleString("en-US",{minimumFractionDigits:inst.decimals,maximumFractionDigits:inst.decimals}) + inst.suffix; }
function fmtTime(ms){ return new Date(ms).toLocaleTimeString("en-US",{timeZone:"America/New_York",hour:"2-digit",minute:"2-digit",hour12:false}); }
function fmtX(ms, spanMs){
  if(spanMs > 36 * 60 * 60 * 1000){
    return new Date(ms).toLocaleString("en-US",{timeZone:"America/New_York",day:"2-digit"});
  }
  return fmtTime(ms);
}
function transformValue(key, value){ return Number(value); }

function cleanBondSource(data){
  return (data || []).map((p, i) => {
    const prevClose = i > 0 ? Number(data[i - 1].c) : Number(p.o || p.c);
    const close = Number(p.c);
    const open = prevClose || close;
    const bodyHi = Math.max(open, close);
    const bodyLo = Math.min(open, close);
    // mecha solo proporcional al movimiento real: si el precio no se movio (feed
    // congelado / feriado) la vela queda como doji limpio, sin cerdas sinteticas
    const wick = Math.abs(close - open) * 0.18;
    return {
      t: p.t,
      o: open,
      h: bodyHi + wick,
      l: bodyLo - wick,
      c: close
    };
  });
}

function redrawAll(){
  INSTRUMENTS.forEach(draw);
}

function redrawKey(key){
  const inst = INSTRUMENTS.find(item => item.key === key);
  if(inst) draw(inst);
}

function clampOffset(v, totalBars){
  if(!totalBars){ v.xOffset = 0; return; }
  const visibleCount = Math.max(MIN_VISIBLE_BARS, Math.floor(totalBars / Math.max(1, v.xZoom)));
  const maxOffset = Math.max(0, totalBars - visibleCount);
  v.xOffset = clamp(v.xOffset || 0, 0, maxOffset);
}

function animateViewZoom(key){
  const v = view(key);
  if(v.zoomFrame) return;

  function step(){
    v.xZoom += (v.targetXZoom - v.xZoom) * 0.22;
    v.yZoom += (v.targetYZoom - v.yZoom) * 0.22;
    if(Math.abs(v.targetXZoom - v.xZoom) < 0.003) v.xZoom = v.targetXZoom;
    if(Math.abs(v.targetYZoom - v.yZoom) < 0.003) v.yZoom = v.targetYZoom;
    redrawKey(key);
    if(v.xZoom !== v.targetXZoom || v.yZoom !== v.targetYZoom) v.zoomFrame = requestAnimationFrame(step);
    else v.zoomFrame = null;
  }

  v.zoomFrame = requestAnimationFrame(step);
}

function scaleBoundsForPrice(renderData, inst, yZoom){
  const allValues = renderData.flatMap(p => inst.mode === "line" ? [p.c] : [p.h,p.l]);
  const min = Math.min(...allValues);
  const max = Math.max(...allValues);
  const visibleRange = max - min || 1;
  const recent = renderData.slice(-Math.min(60, renderData.length));
  const recentValues = recent.flatMap(p => inst.mode === "line" ? [p.c] : [p.h,p.l]);
  const recentMin = Math.min(...recentValues);
  const recentMax = Math.max(...recentValues);
  const recentRange = recentMax - recentMin || visibleRange || 1;
  const last = renderData[renderData.length - 1].c;
  const recentPosition = clamp((last - recentMin) / recentRange, 0, 1);
  let targetRatio = 0.82 - recentPosition * 0.64;
  targetRatio = clamp(targetRatio, 0.16, 0.84);

  const topPad = visibleRange * 0.055;
  const bottomPad = visibleRange * 0.055;
  const requiredUp = Math.max(max + topPad - last, visibleRange * 0.12);
  const requiredDown = Math.max(last - (min - bottomPad), visibleRange * 0.12);
  let range = Math.max(
    requiredUp / Math.max(0.05, targetRatio),
    requiredDown / Math.max(0.05, 1 - targetRatio),
    visibleRange * 1.1
  );

  if(yZoom !== 1) range = range / Math.max(.55, yZoom);
  return {
    lo: last - range * (1 - targetRatio),
    hi: last + range * targetRatio,
    last
  };
}

function updateClock(){
  const s = new Date().toLocaleTimeString("en-US",{timeZone:"America/New_York",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
  document.getElementById("clock").textContent = "NY " + s;
  updateCountdownBadges();
}

function candleCountdownText(ms){
  const intervalMap = {"1m":60000,"5m":300000,"15m":900000,"30m":1800000};
  const interval = intervalMap[CURRENT_INTERVAL] || 300000;
  let left = interval - (ms % interval);
  if(left === interval) left = 0;
  const totalSeconds = Math.max(0, Math.ceil(left / 1000));
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;
  return String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");
}

function updateCountdownBadges(){
  const text = candleCountdownText(Date.now());
  document.querySelectorAll(".badge .cd").forEach(el => { el.textContent = text; });
}

function buildPanel(inst){
  const panel = document.createElement("div");
  panel.className = "panel";
  panel.id = "panel-" + inst.key;
  panel.innerHTML = `
    <div class="head">
      <div class="title"><span class="dot" style="background:${inst.dot}"></span><span>${inst.title}</span><span class="meta" id="meta-${inst.key}">Â· 5 Â· TVC</span></div>
      <div class="price-row"><span class="price" id="price-${inst.key}">--</span><span class="chg" id="chg-${inst.key}"></span><span class="tick-time" id="tick-${inst.key}"></span></div>
    </div>
    <div class="unit">${inst.unit}</div>
    <div class="chart">
      <div class="wm"><div class="wm-symbol" id="wm-${inst.key}">${inst.symbol}, 5</div><div class="wm-label">${inst.title}</div></div>
      <canvas class="main" id="main-${inst.key}"></canvas>
      <div class="yaxis"><canvas id="y-${inst.key}"></canvas></div>
      <div class="xaxis"><canvas id="x-${inst.key}"></canvas></div>
      <div class="hline" id="h-${inst.key}"></div>
      <div class="badge" id="b-${inst.key}"></div>
      <div class="loading" id="load-${inst.key}"><div class="spin"></div><span>Cargando...</span></div>
    </div>`;

  const chart = panel.querySelector(".chart");
  chart.addEventListener("wheel", (e) => {
    e.preventDefault();
    const rect = chart.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const v = view(inst.key);
    const totalBars = v.data ? v.data.length : 0;

    if(e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)){
      const panDelta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      v.xOffset = (v.xOffset || 0) + panDelta / 42;
      clampOffset(v, totalBars);
      redrawKey(inst.key);
      return;
    }

    let factor = Math.exp((-e.deltaY / 2400));
    factor = clamp(factor, 0.92, 1.09);
    if (x > rect.width - 78) v.targetYZoom = clamp(v.targetYZoom * factor, .55, 8);
    else {
      v.targetXZoom = clamp(v.targetXZoom * factor, 1, MAX_X_ZOOM);
      v.xOffset = Math.round((v.xOffset || 0) * factor);
      clampOffset(v, totalBars);
    }
    animateViewZoom(inst.key);
  }, {passive:false});

  chart.addEventListener("mousedown", (e) => {
    if(e.button !== 0) return;
    const v = view(inst.key);
    if(!v.data || v.data.length < 2) return;
    dragState[inst.key] = {
      x: e.clientX,
      offset: v.xOffset || 0,
      total: v.data.length,
      width: Math.max(1, chart.clientWidth - 100)
    };
  });

  window.addEventListener("mousemove", (e) => {
    const drag = dragState[inst.key];
    if(!drag) return;
    const v = view(inst.key);
    const visibleCount = Math.max(MIN_VISIBLE_BARS, Math.floor(drag.total / Math.max(1, v.xZoom)));
    const barsPerPx = visibleCount / drag.width;
    v.xOffset = drag.offset + (e.clientX - drag.x) * barsPerPx;
    clampOffset(v, drag.total);
    redrawKey(inst.key);
  });

  window.addEventListener("mouseup", () => { dragState[inst.key] = null; });

  chart.addEventListener("dblclick", () => {
    const v = view(inst.key);
    v.targetXZoom = 7;
    v.targetYZoom = 1;
    v.xOffset = 0;
    animateViewZoom(inst.key);
  });
  return panel;
}

function parseYahoo(inst, payload){
  const result = payload?.chart?.result?.[0];
  const quote = result?.indicators?.quote?.[0];
  const times = result?.timestamp || [];
  const out = [];
  for(let i=0;i<times.length;i++){
    const c = transformValue(inst.key, quote?.close?.[i]);
    if(!Number.isFinite(c) || c <= 0) continue;
    out.push({
      t: times[i] * 1000,
      o: transformValue(inst.key, quote?.open?.[i]) || c,
      h: transformValue(inst.key, quote?.high?.[i]) || c,
      l: transformValue(inst.key, quote?.low?.[i]) || c,
      c
    });
  }
  return (inst.key === "US10Y" ? cleanBondSource(out) : out).slice(-1200);
}

function heikinAshi(data){
  const out = [];
  data.forEach((p, i) => {
    const close = (p.o + p.h + p.l + p.c) / 4;
    const open = i === 0 ? (p.o + p.c) / 2 : (out[i-1].o + out[i-1].c) / 2;
    out.push({
      t: p.t,
      o: open,
      h: Math.max(p.h, open, close),
      l: Math.min(p.l, open, close),
      c: close
    });
  });
  return out;
}

async function fetchInstrument(inst){
  const r = await fetch(`/api/chart?instrument=${encodeURIComponent(inst.key)}&interval=${encodeURIComponent(CURRENT_INTERVAL)}`, {cache:"no-store"});
  const j = await r.json();
  if(!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return parseYahoo(inst, j);
}

async function fetchLatest(inst){
  const r = await fetch(`/api/latest?instrument=${encodeURIComponent(inst.key)}`, {cache:"no-store"});
  const j = await r.json();
  if(!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  const p = j.point;
  return {
    t: p.t * 1000,
    o: transformValue(inst.key, p.o),
    h: transformValue(inst.key, p.h),
    l: transformValue(inst.key, p.l),
    c: transformValue(inst.key, p.c)
  };
}

// minutos reales del intervalo activo (antes estaba fijo en 5m y corrompia las velas de 15m/30m)
const INTERVAL_MS = {"1m":60000,"5m":300000,"15m":900000,"30m":1800000};
function liveBucketMs(){ return INTERVAL_MS[CURRENT_INTERVAL] || 300000; }

function upsertLivePoint(inst, point){
  const v = view(inst.key);
  if(!v.data || !v.data.length || !Number.isFinite(point.c) || point.c <= 0) return;

  const bucketMs = liveBucketMs();
  const bucket = Math.floor(point.t / bucketMs) * bucketMs;
  const last = v.data[v.data.length - 1];
  const lastBucket = Math.floor(last.t / bucketMs) * bucketMs;

  if(bucket <= lastBucket){
    last.t = Math.max(last.t, point.t);
    if(inst.key === "US10Y"){
      const prevClose = v.data.length > 1 ? Number(v.data[v.data.length - 2].c) : Number(last.o || point.c);
      const clean = cleanBondSource([{...last, c: prevClose}, {t:last.t, c:point.c}])[1];
      last.o = clean.o;
      last.h = clean.h;
      last.l = clean.l;
      last.c = clean.c;
    } else {
      last.h = Math.max(last.h, point.h, point.c);
      last.l = Math.min(last.l, point.l, point.c);
      last.c = point.c;
    }
  } else {
    const open = last.c;
    const close = point.c;
    const bodyHi = Math.max(open, close);
    const bodyLo = Math.min(open, close);
    const wick = inst.key === "US10Y" ? Math.abs(close - open) * 0.18 : 0;
    v.data.push({
      t: bucket,
      o: open,
      h: inst.key === "US10Y" ? bodyHi + wick : Math.max(open, close),
      l: inst.key === "US10Y" ? bodyLo - wick : Math.min(open, close),
      c: close
    });
    if(v.data.length > 1200) v.data = v.data.slice(-1200);
  }
  document.getElementById("tick-" + inst.key).textContent = fmtTime(point.t);
  draw(inst);
}

function updateHeader(inst, data){
  const first = data[0].c, last = data[data.length-1].c;
  const diff = last - first;
  const pct = diff / first * 100;
  const up = diff >= 0;
  document.getElementById("price-" + inst.key).textContent = fmt(last, inst);
  const ch = document.getElementById("chg-" + inst.key);
  ch.textContent = `${up ? "+" : ""}${fmt(diff, inst)} (${up ? "+" : ""}${pct.toFixed(2)}%)`;
  ch.className = "chg " + (up ? "up" : "dn");
  return up;
}

// Deteccion de feed congelado: cuenta velas consecutivas al final con el mismo cierre.
// Cuando el mercado de referencia esta cerrado (ej. feriado de bonos), Yahoo repite
// la ultima cotizacion durante horas y el tick se ve estancado aunque la hora avance.
const FROZEN_BARS_LIMIT = 12;
function frozenBars(data){
  if(!data || data.length < 2) return 0;
  const lastC = Number(data[data.length-1].c);
  let n = 0;
  for(let i = data.length-1; i >= 0; i--){
    if(Math.abs(Number(data[i].c) - lastC) < 1e-9) n++;
    else break;
  }
  return n;
}

function updateTickTime(inst, data, frozenRun){
  const el = document.getElementById("tick-" + inst.key);
  if(!el) return;
  const run = typeof frozenRun === "number" ? frozenRun : frozenBars(data);
  if(run >= FROZEN_BARS_LIMIT){
    el.textContent = "Mercado cerrado";
    el.style.color = "var(--gold)";
  } else {
    el.textContent = fmtTime(data[data.length-1].t);
    el.style.color = "";
  }
}

function draw(inst){
  const v = view(inst.key);
  let data = v.data || [];
  const load = document.getElementById("load-" + inst.key);
  if(data.length < 2){
    load.innerHTML = "<span>Sin datos</span>";
    load.style.display = "flex";
    return;
  }
  load.style.display = "none";
  let atLatest = true;
  // Racha congelada medida sobre el feed COMPLETO (se reutiliza para la etiqueta
  // "Mercado cerrado" del tick, porque despues del recorte ya no seria medible)
  const frozenRun = frozenBars(data);
  if(frozenRun > 1){
    // Recorte del tramo estancado: cuando el mercado de referencia esta cerrado
    // (ej. feriado de bonos) la fuente repite el ultimo cierre durante horas y
    // ese tramo plano domina el grafico. Se deja solo la vela de llegada, para
    // que el panel termine en la ultima vela real como el resto.
    data = data.slice(0, Math.max(2, data.length - (frozenRun - 1)));
  }
  if(data.length > 2) {
    const fullData = data;
    let visibleCount = Math.max(MIN_VISIBLE_BARS, Math.floor(fullData.length / Math.max(1, v.xZoom)));
    visibleCount = Math.min(fullData.length, visibleCount);
    clampOffset(v, fullData.length);
    atLatest = !v.xOffset || v.xOffset < 0.5;
    let end = fullData.length - Math.round(v.xOffset || 0);
    end = clamp(end, visibleCount, fullData.length);
    const start = Math.max(0, end - visibleCount);
    data = fullData.slice(start, end);
  }

  const chart = document.querySelector(`#panel-${inst.key} .chart`);
  const main = document.getElementById("main-" + inst.key);
  const yCanvas = document.getElementById("y-" + inst.key);
  const xCanvas = document.getElementById("x-" + inst.key);
  const hline = document.getElementById("h-" + inst.key);
  const badge = document.getElementById("b-" + inst.key);
  const YW = 70, XH = 28, GAP = 24;
  const w = chart.offsetWidth - YW;
  const h = chart.offsetHeight - XH;
  if(w <= 0 || h <= 0) return;

  const renderData = inst.mode === "heikin" ? heikinAshi(data) : data;
  const scale = scaleBoundsForPrice(renderData, inst, v.yZoom);
  const lo = scale.lo;
  const hi = scale.hi;
  const last = scale.last;
  const y = val => h - ((val - lo) / (hi - lo)) * h;
  const x = i => (i / (data.length-1)) * Math.max(1, w - GAP);
  const up = updateHeader(inst, data);
  updateTickTime(inst, data, frozenRun);

  const ctx = fitCanvas(main, w, h);
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle=THEME.grid;
  ctx.lineWidth=1;
  for(let i=0;i<=5;i++){ const yy=Math.round(h/5*i)+.5; ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(w,yy); ctx.stroke(); }
  for(let i=0;i<=5;i++){ const xx=Math.round(w/5*i)+.5; ctx.beginPath(); ctx.moveTo(xx,0); ctx.lineTo(xx,h); ctx.stroke(); }

  if(inst.mode === "line"){
    ctx.strokeStyle = inst.color;
    ctx.lineWidth = 1.45;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.beginPath();
    renderData.forEach((p,i)=>{ const xx=x(i), yy=y(p.c); if(i===0) ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy); });
    ctx.stroke();
  } else {
    const candleW = clamp((w-GAP) / renderData.length * .64, 2, 11);
    renderData.forEach((p,i)=>{
      const xx=x(i), yo=y(p.o), yc=y(p.c), yh=y(p.h), yl=y(p.l);
      const rising = p.c >= p.o;
      ctx.strokeStyle = rising ? THEME.candleUp : THEME.candleDn;
      ctx.fillStyle = rising ? THEME.candleUp : THEME.candleDnFill;
      ctx.beginPath(); ctx.moveTo(xx,yh); ctx.lineTo(xx,yl); ctx.stroke();
      const top = Math.min(yo,yc), bodyH = Math.max(1, Math.abs(yc-yo));
      ctx.fillRect(xx-candleW/2, top, candleW, bodyH);
      ctx.strokeRect(xx-candleW/2, top, candleW, bodyH);
    });
  }

  const lastY = clamp(y(last), 1, h-1);
  hline.style.display="block"; hline.style.top=Math.round(lastY)+"px";
  badge.style.display="block"; badge.style.top=Math.round(lastY)+"px"; badge.innerHTML=`<span>${fmt(last, inst)}</span><span class="cd">${candleCountdownText(Date.now())}</span>`;
  badge.style.background = inst.mode === "line" ? (THEME.badgeLine || "#ff334f") : THEME.badgeBg;
  badge.style.color = inst.mode === "line" ? "#fff" : THEME.badgeTx;

  const yctx=fitCanvas(yCanvas, YW, h);
  yctx.clearRect(0,0,YW,h); yctx.fillStyle=THEME.panel; yctx.fillRect(0,0,YW,h);
  yctx.font='11px Arial,Helvetica,sans-serif'; yctx.textAlign="right";
  for(let i=0;i<=6;i++){
    if(i === 0) continue;
    const val = hi - (hi-lo)/6*i, yy=Math.round(h/6*i);
    yctx.fillStyle=THEME.tick; yctx.fillRect(0,yy,5,1);
    yctx.fillStyle=THEME.axisTextY; yctx.fillText(fmt(val,inst), YW-10, clamp(yy+3,9,h-2));
  }

  const xctx=fitCanvas(xCanvas, w, XH);
  xctx.clearRect(0,0,w,XH); xctx.fillStyle=THEME.panel; xctx.fillRect(0,0,w,XH);
  xctx.font='11px Arial,Helvetica,sans-serif'; xctx.fillStyle=THEME.axisTextX; xctx.textAlign="center";
  const seen={};
  for(let i=0;i<5;i++){
    const spanMs = data[data.length-1].t - data[0].t;
    const idx=Math.round(i/4*(data.length-1)); const label=fmtX(data[idx].t, spanMs);
    if(seen[label]) continue; seen[label]=true;
    xctx.fillText(label, clamp(x(idx),24,w-28), 20);
  }
}

async function loadAll(){
  await Promise.all(INSTRUMENTS.map(async inst => {
    const load = document.getElementById("load-" + inst.key);
    if(!view(inst.key).data || !view(inst.key).data.length){
      load.innerHTML = '<div class="spin"></div><span>Cargando...</span>';
      load.style.display = "flex";
    }
    try{
      view(inst.key).data = await fetchInstrument(inst);
      draw(inst);
    }catch(e){
      load.innerHTML = `<span>${e.message || "Error cargando datos"}</span>`;
      load.style.display = "flex";
    }
  }));
}

async function updateLive(){
  await Promise.all(INSTRUMENTS.map(async inst => {
    try{
      const point = await fetchLatest(inst);
      upsertLivePoint(inst, point);
    }catch(e){}
  }));
}

function switchInterval(newInterval) {
  CURRENT_INTERVAL = newInterval;
  const labels = {"1m":"1 min","5m":"5 min","15m":"15 min","30m":"30 min"};
  const shortLabels = {"1m":"1","5m":"5","15m":"15","30m":"30"};
  document.getElementById("intervalLabel").textContent = labels[newInterval] || newInterval;
  // Update button styles
  document.querySelectorAll(".interval-btn").forEach(b => {
    if (b.getAttribute("data-interval") === newInterval) {
      b.style.background = "#FF8C42";
      b.style.color = "#fff";
    } else {
      b.style.background = "#252630";
      b.style.color = "#8a8a95";
    }
  });
  // Update watermarks and meta labels in all panels
  const tfShort = shortLabels[newInterval] || "5";
  INSTRUMENTS.forEach(inst => {
    const wm = document.getElementById("wm-" + inst.key);
    if (wm) wm.textContent = inst.symbol + ", " + tfShort;
    const meta = document.getElementById("meta-" + inst.key);
    if (meta) meta.innerHTML = "&middot; " + tfShort + " &middot; TVC";
  });
  // Reload all charts
  loadAll();
}

function init(){
  const grid=document.getElementById("grid");
  INSTRUMENTS.forEach(i => grid.appendChild(buildPanel(i)));
  updateClock(); setInterval(updateClock,1000);
  loadAll();
  refreshTimer = setInterval(loadAll, 60000);
  liveTimer = setInterval(updateLive, 3000);
  window.addEventListener("resize", () => INSTRUMENTS.forEach(draw));
}
init();
</script>
