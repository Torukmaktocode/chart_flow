<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ChartFlow Desktop</title>
<style>
:root{
  --bg:#0D0E0E;--panel:#141519;--hover:#24262b;--border:rgba(255,255,255,.08);
  --text:#f4f4f5;--dim:#92939a;--ok:#00c896;--warn:#ffc800;--err:#ff3355;
  --font:'JetBrains Mono',Consolas,monospace;--ui:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--ui)}
.topbar{height:34px;display:flex;align-items:center;gap:4px;background:var(--panel);border-bottom:1px solid var(--border);padding:0 10px;flex-shrink:0}
.brand{font:800 12px var(--font);letter-spacing:1px;margin-right:8px;white-space:nowrap}
.brand b{color:var(--ok)}
.tab{height:24px;padding:0 12px;border:1px solid var(--border);background:transparent;color:var(--dim);border-radius:4px;font:700 10px var(--ui);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--text);border-color:rgba(255,255,255,.2)}
.tab.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.spacer{flex:1}
.svc{display:flex;align-items:center;gap:5px;font:10px var(--font);color:var(--dim);margin-left:8px;white-space:nowrap}
.led{width:7px;height:7px;border-radius:50%;background:var(--err)}
.led.up{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.led.mid{background:var(--warn)}
.main{flex:1;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
iframe.show{display:block}
.footer{height:16px;background:var(--bg);border-top:1px solid var(--border);display:flex;overflow:hidden;padding:1px 8px;gap:14px;font:9px var(--font);color:var(--dim);flex-shrink:0;white-space:nowrap}
.line{white-space:pre;display:inline;line-height:13px;overflow:hidden;text-overflow:ellipsis;margin-right:12px}
</style>
</head>
<body>
<div class="topbar">
  <span class="brand">CHART FLOW <b>DESKTOP</b></span>
  <button class="tab" data-tab="backtest" data-port="8790">📈 Backtesting</button>
  <button class="tab" data-tab="warroom" data-port="3001">📰 War Room</button>
  <button class="tab" data-tab="stock" data-port="8765">📊 Stocks</button>
  <button class="tab" data-tab="macro" data-port="8770">💵 Dolar/VIX</button>
  <button class="tab" data-tab="chartflow" data-port="8780">⚡ ChartFlow</button>
  <span class="spacer"></span>
  <div class="svc" id="leds"></div>
</div>

<div class="main" id="panes">
  <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font:11px var(--font)">cargando paneles nativos...</div>
</div>

<div class="footer" id="footerBar"><span class="line">servicios listos · logs en la consola del sistema</span></div>

<script>
const PORTS = { backtest:8790, warroom:3001, stock:8765, macro:8770, chartflow:8780 };
function activate(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.tab===name));
  window.cf.activate(name); // pide al proceso principal mostrar el panel nativo
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>activate(t.dataset.tab));
activate('backtest');

// LEDs de estado
function renderLeds(list){
  const box = document.getElementById('leds');
  box.innerHTML = list.map(s=>{
    const up = /ACTIVO|corriendo/.test(s.status);
    const mid = /iniciando/.test(s.status);
    return `<span class="svc" title="${s.label}: ${s.status}"><span class="led ${up?'up':mid?'mid':''}"></span>${s.name}</span>`;
  }).join("");
}
window.cf.onStatus(list => renderLeds(list));
window.cf.onLog(({name, line}) => {
  const bar = document.getElementById('footerBar');
  // los logos que NO provienen de paneles emitidos: mantener aprox 4 rotando
  const el = document.createElement('span');
  el.className='line';
  el.textContent = name + ': ' + line;
  bar.appendChild(el);
  while (bar.children.length > 4) bar.removeChild(bar.firstChild);
});

// primer estado + refresco automatico
window.cf.services().then(renderLeds);
</script>
</body>
</html>
