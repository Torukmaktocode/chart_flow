<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading War Room — NAS100 Live</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--bg2:#111111;--bg3:#1a1a1a;
  --bd:#2a2a2a;--bd2:#333333;--bd3:#3d3d3d;
  --tx:#e0e0e0;--tx2:#999999;--tx3:#666666;--tx4:#444444;
  --gn:#22c55e;--rd:#ef4444;--am:#f59e0b;
  --bl:#3b82f6;--pu:#8b5cf6;--or:#f97316
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:13px}

/* HEADER */
.hdr{background:var(--bg2);border-bottom:1px solid var(--bd);padding:8px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.logo{font-size:13px;font-weight:600;letter-spacing:.04em;color:#f8fafc}.logo b{color:var(--am)}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;animation:pulse 1.4s infinite}
.dot.live{background:var(--gn)}.dot.loading{background:var(--am)}.dot.error{background:var(--rd)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.badge{font-size:9px;font-weight:600;padding:2px 7px;border-radius:3px;white-space:nowrap}
.bg{background:#052e16;color:var(--gn)}.br{background:#1c0000;color:var(--rd)}
.ba{background:#1a1000;color:var(--am)}.bb{background:#0a1628;color:var(--bl)}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:6px}
.clk{font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums}
.lbtn{background:var(--bg3);border:1px solid var(--bd2);border-radius:4px;padding:3px 9px;font-size:10px;font-weight:600;color:var(--tx2);cursor:pointer;transition:all .15s}
.lbtn:hover{background:var(--bd)}.lbtn.on{background:var(--am);color:#000;border-color:var(--am)}
.free-badge{font-size:9px;background:#052e16;color:var(--gn);padding:2px 6px;border-radius:3px;border:1px solid #166534}
.src-info{font-size:9px;color:var(--tx4);flex-shrink:0}

/* SESIONES GLOBALES — relojes digitales (Asia · Londres · NY) */
.sesrow{display:flex;gap:10px;padding:8px 14px;background:var(--bg);border-bottom:1px solid var(--bd);flex-shrink:0;overflow-x:auto}
.sesclock{display:flex;gap:12px;align-items:center;justify-content:space-between;flex:1;min-width:215px;background:var(--bg2);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;transition:border-color .3s}
.sesclock.abierto{border-color:rgba(34,197,94,.4)}
.sesclock.cerrada{opacity:.75}
.sesclock .sesnom{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--tx2)}
.sesclock.abierto .sesnom{color:var(--gn)}
.sesclock .sesciudad{font-size:9px;color:var(--tx4)}
.sesdig{font-family:'Consolas','Courier New',monospace;font-size:23px;font-weight:600;color:#f8fafc;font-variant-numeric:tabular-nums;letter-spacing:.03em;line-height:1.2}
.sesdig small{font-size:11px;color:var(--tx4);font-weight:400}
.sesdif{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.sesst{font-size:9px;font-weight:700;padding:2px 7px;border-radius:3px;letter-spacing:.04em;white-space:nowrap}
.sesst.so{background:#052e16;color:var(--gn)}
.sesst.sc{background:#1c0000;color:#fca5a5}
.sescnt{font-size:10px;color:var(--am);font-weight:700;letter-spacing:.02em}
.seshz{font-size:10.5px;font-weight:500;color:#8a939b;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.seshz b{color:#d8e0e6;font-weight:600}
.seshz2{font-size:12.5px;font-weight:700;color:#c9d2da;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.seshz2 i{font-style:normal;color:#fbbf24}

/* BANNER */
.banner{background:#1a1a1a;border-bottom:1px solid #333333;padding:6px 14px;display:none;align-items:center;gap:8px;font-size:11px;color:#cccccc;flex-shrink:0}
.banner.show{display:flex}
.bdot{width:6px;height:6px;border-radius:50%;background:var(--or);animation:pulse .7s infinite;flex-shrink:0}

/* BODY — feed a ancho completo (la sidebar y el strip de impacto se eliminaron:
   el contexto multi-activo vive ahora dentro de cada noticia) */
.body{display:grid;grid-template-columns:1fr;flex:1;overflow:hidden;min-height:0}

/* FEED */
.feed{display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--bd);flex-shrink:0;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 12px;font-size:10px;color:var(--tx3);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--tx2)}.tab.on{color:var(--am);border-bottom-color:var(--am);font-weight:600}
.srow{display:flex;gap:5px;padding:7px 7px 3px;flex-shrink:0}
.srow input{flex:1;background:var(--bg3);border:1px solid var(--bd);border-radius:4px;padding:5px 9px;font-size:11px;color:var(--tx);outline:none}
.srow input::placeholder{color:var(--tx4)}.srow input:focus{border-color:var(--bd3)}
.rbtn{background:var(--bd);border:none;color:var(--am);padding:5px 10px;border-radius:4px;font-size:11px;cursor:pointer}
.rbtn:hover{background:var(--bd3)}
.flist{flex:1;overflow-y:auto;padding:5px}
.flist::-webkit-scrollbar{width:3px}.flist::-webkit-scrollbar-thumb{background:var(--bd)}

/* LOADING */
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--bd);border-top-color:var(--am);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-msg{text-align:center;color:var(--tx4);font-size:12px;padding:30px 0}

/* NEWS CARD — ancho completo, tipografía más legible */
.nc{background:var(--bg2);border:1px solid var(--bd);border-radius:6px;padding:11px 13px;margin-bottom:7px;animation:si .2s ease;cursor:pointer;transition:border-color .15s}
.nc:hover{border-color:var(--bd3)}
@keyframes si{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.nc.c{border-left:3px solid var(--rd)}.nc.h{border-left:3px solid var(--am)}
.nc.m{border-left:3px solid var(--bl)}.nc.l{border-left:3px solid var(--bd)}
.nc-top{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.src{font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:3px}
.sr{background:#333333;color:#cccccc}.st{background:#333333;color:#cccccc}
.sf{background:#222222;color:#cccccc}.sb{background:#333333;color:#cccccc}
.sa{background:#7f1d1d;color:#fca5a5}.sc{background:#1a1a2e;color:#a0a8c0}
.sy{background:#0a1628;color:#93c5fd}.si{background:#0d2010;color:#86efac}
.ss{background:#1a0040;color:#c4b5fd}.sbl{background:#0d1626;color:#93c5fd}
.sec{background:#2a1a00;color:#fbbf24}
.calsec{padding:10px 12px 5px;font-size:10px;letter-spacing:1.2px;color:var(--tx3);font-weight:700}
.calstick{position:sticky;top:0;z-index:6;background:rgba(13,14,14,0.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--bd)}
.calhead{display:grid;gap:8px;padding:7px 12px;font-size:10px;letter-spacing:0.8px;color:var(--tx2);font-weight:700;text-transform:uppercase;border-bottom:1px solid #333333}
.calday{padding:9px 12px 4px;font-size:12px;color:var(--tx1,#e5e5e5);font-weight:700;text-align:center;background:#111111;border-top:1px solid var(--bd)}
.calsep{padding:8px 12px 3px;font-size:11px;color:var(--tx2);font-weight:700;text-align:center;background:#111111;border-top:1px solid var(--bd)}
.calrow{display:grid;grid-template-columns:58px 48px minmax(150px,1fr) 80px 88px 88px 74px 62px;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--bd);font-size:12px}
.calrow.ihigh{background:rgba(239,68,68,0.05)}.calrow.imed{background:rgba(245,158,11,0.06)}
.caltime{color:var(--tx3);font-variant-numeric:tabular-nums;font-size:11px}
.calcur{background:#1a1a2e;color:#a0a8c0;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;text-align:center}
.calname{min-width:0;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calname .sigla{display:inline-block;margin-left:5px;padding:0 5px;border:1px solid #3d3d3d;border-radius:3px;font-size:9px;font-weight:700;color:#e5c84b;font-style:normal;vertical-align:middle}
.calrow.sp .calname{color:var(--tx3);font-style:italic}
.mic{width:15px;height:15px;vertical-align:-2.5px;pointer-events:none;flex-shrink:0}
.calcol{color:var(--tx3);font-variant-numeric:tabular-nums;font-size:11.5px}
.calcol.cact{color:#86efac;font-weight:700}
.calcol i{font-style:normal}
.mkup{color:#22c55e}.mkdn{color:#ef4444}
.calimp{padding:2px 7px;border-radius:4px;font-size:9px;font-weight:700;text-align:center}
.ih{background:#7f1d1d;color:#fca5a5}.im{background:#78350f;color:#fdba74}.il{background:#1a1a1a;color:#6b7280}
.calstate{text-align:right}
.calcnt{font-size:10px;color:#22c55e}
.cntwarn{color:#fde68a}
.cnturgent{color:#ef4444;font-weight:700}
.cntblink{animation:cntblink .35s steps(2,start) infinite}
@keyframes cntblink{0%{opacity:1}50%{opacity:0.1}100%{opacity:1}}
.caldone{color:var(--tx3);font-size:11px}
.cwait{color:var(--tx3);animation:blink 1.2s infinite}
.calsempty{padding:12px;font-size:11px;color:var(--tx3)}
.calchips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--bd);align-items:center}
.calspace{flex:1}
.vchip{border-color:#2f2f3a;color:#aab4c4}
.vchip.on{background:linear-gradient(180deg,#60a5fa,#3b82f6);border-color:#60a5fa;color:#0b1220;box-shadow:0 2px 10px rgba(96,165,250,0.25)}
.cchip{background:#141414;border:1px solid #2a2a2a;color:#9a9a9a;padding:5px 13px;border-radius:999px;font-size:10.5px;font-weight:700;cursor:pointer;letter-spacing:0.6px;transition:all .15s ease;display:inline-flex;align-items:center;gap:4px;font-family:inherit}
.cchip i{font-style:normal;opacity:0.55;font-weight:600}
.cchip:hover{border-color:#3d3d3d;color:#e5e5e5;transform:translateY(-1px)}
.cchip.on{background:linear-gradient(180deg,#fbbf24,#f59e0b);border-color:#fbbf24;color:#1a1200;box-shadow:0 2px 10px rgba(251,191,36,0.25)}
.cchip.on i{opacity:0.8}
@keyframes blink{50%{opacity:0.3}}
@keyframes blink{50%{opacity:0.3}}
.sw{background:#1a1a1a;color:#e5e7eb}.sbr{background:#1a0a00;color:#fcd34d}
.ib{font-size:9px;font-weight:700;padding:2px 5px;border-radius:3px}
.ibc{background:var(--rd);color:#fff}.ibh{background:var(--am);color:#000}
.ibm{background:var(--bl);color:#fff}.ibl{background:var(--bd);color:var(--tx3)}
.ago{font-size:11px;color:var(--tx2);margin-left:auto;font-weight:600;white-space:nowrap}
.nc-title{font-size:12.5px;color:#e2e8f0;line-height:1.5;font-weight:600;margin-bottom:4px}
.nc-body{font-size:11px;color:var(--tx3);line-height:1.55;margin-bottom:5px}
.nc-imp{display:flex;align-items:flex-start;gap:5px;background:var(--bg3);border-radius:4px;padding:4px 7px;margin:4px 0;border:1px solid var(--bd)}
.nc-link{font-size:9px;color:var(--bl);text-decoration:none;opacity:.7}.nc-link:hover{opacity:1}
.ntag{font-size:9px;background:#0f172a;color:var(--tx3);padding:1px 5px;border-radius:2px}
.nt-n{color:var(--gn);background:#021a0c}.nt-v{color:var(--am);background:#1a1000}
.nt-c{color:var(--rd);background:#1a0000}

/* TRUMP CARD — base */
.tc{border-radius:6px;padding:8px 9px;margin-bottom:5px;animation:si .2s ease;border:1px solid}
/* Posts DIRECTOS de @realDonaldTrump — azul patriótico */
.tc.direct{background:#111111;border-color:#333333;box-shadow:inset 3px 0 0 #555555}
/* Posts de otras fuentes citando a Trump — naranja original */
.tc.indirect{background:#0a0500;border-color:#431407;box-shadow:inset 3px 0 0 #c2410c}
.tc-h{display:flex;align-items:center;gap:6px;margin-bottom:5px}
/* Avatar directo = azul bandera USA */
.tc-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.tc-av.direct{background:#1d4ed8;border:2px solid #3b82f6}
.tc-av.indirect{background:#c2410c;border:2px solid #ea580c}
/* Nombre y handle */
.tc-name.direct{font-size:11px;font-weight:700;color:#60a5fa}
.tc-name.indirect{font-size:11px;font-weight:600;color:var(--am)}
.tc-handle.direct{font-size:9px;color:#1e40af}
.tc-handle.indirect{font-size:9px;color:#555555}
/* Badge "DIRECTO" */
.tc-official{font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;display:flex;align-items:center;gap:3px;white-space:nowrap}
.tc-official.direct{background:#333333;color:#cccccc;border:1px solid #555555}
.tc-official.indirect{background:#431407;color:#fb923c}
.tc-body.direct{font-size:11px;color:#bfdbfe;line-height:1.55;margin-bottom:5px}
.tc-body.indirect{font-size:11px;color:#fed7aa;line-height:1.55;margin-bottom:5px}
.tc-foot{display:flex;gap:8px;font-size:9px;align-items:center}
.tc-foot.direct{color:#555555}
.tc-foot.indirect{color:#78350f}
/* Barra superior de color en cards directas */
.tc-topbar{height:3px;border-radius:3px 3px 0 0;margin:-8px -9px 8px;display:block}
.tc-topbar.direct{background:linear-gradient(90deg,#b91c1c 33%,#fff 33% 66%,#1d4ed8 66%)}
.tc-topbar.indirect{background:#333333}

/* SQUAWK CARDS — @DeItaone @FirstSquawk @LiveSquawk */
.sq{border-radius:6px;padding:8px 9px;margin-bottom:5px;animation:si .2s ease;border:1px solid}
.sq-delta  {background:#0d0520;border-color:#4c1d95;box-shadow:inset 3px 0 0 #7c3aed}
.sq-first  {background:#001828;border-color:#0c4a6e;box-shadow:inset 3px 0 0 #0ea5e9}
.sq-live   {background:#001810;border-color:#064e3b;box-shadow:inset 3px 0 0 #10b981}
.sq-h{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.sq-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.sq-av.delta{background:#7c3aed}.sq-av.first{background:#0ea5e9}.sq-av.live{background:#10b981}
.sq-name{font-size:11px;font-weight:700}.sq-handle{font-size:9px;opacity:.6}
.sq-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;display:flex;align-items:center;gap:3px;white-space:nowrap;margin-left:auto}
.sq-badge.delta{background:#4c1d95;color:#c4b5fd;border:1px solid #7c3aed}
.sq-badge.first{background:#0c4a6e;color:#7dd3fc;border:1px solid #0ea5e9}
.sq-badge.live {background:#064e3b;color:#6ee7b7;border:1px solid #10b981}
.sq-body{font-size:11px;line-height:1.55;margin-bottom:5px}
.sq-body.delta{color:#ddd6fe}.sq-body.first{color:#bae6fd}.sq-body.live{color:#a7f3d0}
.sq-topbar{height:3px;border-radius:3px 3px 0 0;margin:-8px -9px 8px;display:block}
.sq-foot{display:flex;gap:8px;font-size:9px;align-items:center;opacity:.6}
/* X logo en SVG */
.x-icon{width:11px;height:11px;flex-shrink:0}
/* Direcciones — ticker y chips de contexto */
.up{color:var(--gn)}.dn{color:var(--rd)}.ne{color:var(--am)}

/* RAÍL DE CONTEXTO MULTI-ACTIVO (por noticia) */
.xcrail{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;flex-shrink:0}
.xc{display:inline-flex;gap:4px;align-items:center;background:var(--bg3);border:1px solid var(--bd);border-radius:3px;padding:2.5px 7px;font-size:9.5px;color:var(--tx3);font-variant-numeric:tabular-nums;cursor:default}
.xc b{font-size:11px;line-height:1;flex-shrink:0}
.xc span{font-weight:600;letter-spacing:.02em}
.xc i{font-style:normal;color:var(--tx4);font-size:9px}
.xc.up{border-color:#14532d}.xc.up b{color:var(--gn)}.xc.up i{color:#4ade80}
.xc.dn{border-color:#7f1d1d}.xc.dn b{color:var(--rd)}.xc.dn i{color:#f87171}
.xc.ne{opacity:.55}

/* TICKER */
.ticker{background:#0a0a0a;border-top:1px solid var(--bd);padding:5px 9px;display:flex;gap:14px;overflow-x:auto;white-space:nowrap;flex-shrink:0}
.ticker::-webkit-scrollbar{display:none}
.tk{display:flex;gap:4px;align-items:center;font-size:10px}.tks{color:var(--tx3);font-weight:600}

/* ERROR STATE */
.err-box{background:#1a1a1a;border:1px solid #333333;border-radius:6px;padding:16px;margin:12px;color:#cccccc;font-size:11px;line-height:1.7}
.err-box code{background:#0d0300;padding:2px 6px;border-radius:3px;font-family:monospace;font-size:10px;color:#fb923c}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="dot live" id="statusDot"></div>
  <div class="logo">TRADING <b>WAR ROOM</b> — NAS100</div>
  <div class="badge bg" id="nyBadge">NY OPEN</div>
  <div class="badge br" id="vixBadge">VIX —</div>
  <div class="badge ba" id="evtBadge" style="display:none"></div>
  <span class="free-badge">FREE · Sin API keys</span>
  <div class="src-info" id="srcInfo"></div>
  <div class="hdr-r">
    <button class="lbtn on" id="btnEs" onclick="setLang('es')">ES</button>
    <button class="lbtn"    id="btnEn" onclick="setLang('en')">EN</button>
    <div class="clk" id="clk">--:--:-- ET</div>
  </div>
</div>

<!-- SESIONES GLOBALES: relojes digitales en vivo (hora local de la plaza + tu zona horaria) -->
<div class="sesrow" id="sesRow"></div>

<!-- ALERT BANNER -->
<div class="banner" id="banner">
  <div class="bdot"></div>
  <span id="bannerTxt"></span>
  <button onclick="this.parentElement.classList.remove('show')" style="margin-left:auto;background:none;border:none;color:#555555;cursor:pointer;font-size:14px">✕</button>
</div>

<!-- BODY -->
<div class="body">
  <div class="feed">
    <div class="tabs" id="tabRow"></div>
    <div class="srow">
      <input type="text" id="srch" oninput="renderFeed()" placeholder="Buscar noticias...">
      <button class="rbtn" onclick="hardRefresh()">↺</button>
    </div>
    <div class="flist" id="flist">
      <div class="loading-msg"><span class="spinner"></span>Cargando noticias en vivo...</div>
    </div>
  </div>
</div>

<!-- TICKER -->
<div class="ticker" id="tkRow">
  <span style="font-size:10px;color:var(--tx4)">Cargando precios...</span>
</div>

<script>
const API = 'http://localhost:3001/api';

const TL = {
  es:{
    nyOpen:'NY ABIERTO', nyClosed:'NY CERRADO',
    iboxTitle:'Análisis de impacto NAS100 — Noticias en vivo',
    bull:'SESGO ALCISTA ▲', bear:'SESGO BAJISTA ▼', neu:'SESGO NEUTRO',
    mktTit:'Mercados en tiempo real', calTit:'Calendario hoy', alTit:'Alertas activas',
    ph:'Buscar noticias...',
    impUp:'NAS100 AL ALZA ▲', impDn:'NAS100 A LA BAJA ▼', impNeu:'IMPACTO NEUTRO',
    magH:'Magnitud ALTA', magM:'Magnitud MEDIA', magL:'Magnitud BAJA',
    conf:'Confianza', crit:'CRÍTICO', high:'ALTO', med:'MEDIO', low:'BAJO',
    now:'ahora', m:'m', h:'h',
    tabs:['Todo','🎙 Trump / Truth Social','Reuters / AP','Fed / Macro','Mercados / Tech','⚡ Squawk X','📅 Calendario'],
    noServer:`<div class="err-box">
      <b>⚠ Servidor no encontrado</b><br><br>
      Abre una terminal en la carpeta <code>warroom</code> y ejecuta:<br><br>
      <code>node server.js</code><br><br>
      Luego recarga esta página. El servidor agrega 22 feeds RSS gratuitos en tiempo real.
    </div>`,
    upd:'Actualizado'
  },
  en:{
    nyOpen:'NY OPEN', nyClosed:'NY CLOSED',
    iboxTitle:'NAS100 Impact Analysis — Live News',
    bull:'BULLISH BIAS ▲', bear:'BEARISH BIAS ▼', neu:'NEUTRAL BIAS',
    mktTit:'Live Markets', calTit:"Today's Calendar", alTit:'Active Alerts',
    ph:'Search news...',
    impUp:'NAS100 HIGHER ▲', impDn:'NAS100 LOWER ▼', impNeu:'NEUTRAL IMPACT',
    magH:'HIGH Magnitude', magM:'MED Magnitude', magL:'LOW Magnitude',

// ── TRADUCCIÓN vía relay del server (caché + throttle anti-429) ──
const translationCache = new Map();
async function translateText(text, from, to) {
  if (!text || !text.trim()) return text;
  const key = `${to}:${text}`;
  if (translationCache.has(key)) return translationCache.get(key);
  try {
    const d = await api(`/translate?to=${to}&q=${encodeURIComponent(text)}`);
    if (d && d.text && d.text !== text) { translationCache.set(key, d.text); return d.text; }
    return text;
  } catch { return text; }
}
// Titulares via titleEs del server (cola de fondo); cuerpos ya traducidos por el
// servidor (instantáneo) con respaldo del cliente por si falta alguno
let translatingRun = false;
async function translateNewsProgressive() {
  if (translatingRun) return;
  translatingRun = true;
  try {
    for (;;) {
      const batch = allNews.filter(n => !n._translatedEs && !n.econ && n.body && n.body.trim()).slice(0, 20);
      if (!batch.length) break;
      await Promise.allSettled(batch.map(async (n) => {
        if (n.bodyEs) { n._origBody ||= n.body; n.body = n.bodyEs; }
        else if (n.body && !n._origBody) { n._origBody = n.body; n.body = await translateText(n.body, 'en', 'es'); }
        n._translatedEs = true;
      }));
      renderFeed();
    }
  } finally { translatingRun = false; }
}

async function api(ep, qs=''){
  const r = await fetch(`${API}${ep}${qs}`, { signal: AbortSignal.timeout(10000) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

  } catch {
    // Un timeout aislado (red lenta / un feed pesado) NO debe congelar la UI:

    newsFails++;
    console.warn('[NEWS] carga falló (' + newsFails + ' veces), manteniendo datos en pantalla');

      setDot('error');

function ago(ts){
  const d=Math.floor((Date.now()-(ts||0))/60000);
  if(d<1) return t('now');
  if(d<60) return d+t('m');
  return Math.floor(d/60)+t('h');
}

function agoHora(ts){
  if(!ts || isNaN(ts)) return ago(ts);
  const h = new Date(ts).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  return ago(ts) + ' · ' + h;
}

const CROSS_CFG = {
  NAS100:{lab:'NAS100', mk:'NAS100'}, US30:{lab:'US30', mk:'DOW'},
  SPX500:{lab:'SPX',   mk:'SPX'},   VIX:{lab:'VIX',  mk:'VIX'},
  BONOS:{lab:'BONOS',  mk:'US10Y', yld:true}, DOLAR:{lab:'DÓLAR', mk:'DXY'},
  ORO:{lab:'ORO', mk:'GOLD'},
};
function crossRail(n){
  const x = n && n.cross;
  if(!x || !Array.isArray(x.assets)) return impMiniFallback(n);
  const tip = x.tip ? x.tip[lang] || x.tip.es : '';
  const chips = x.assets.map(a=>{
    const cfg = CROSS_CFG[a.k]; if(!cfg) return '';
    const arrow = a.dir==='up' ? '▲' : a.dir==='dn' ? '▼' : '~';
    const d = mktData[cfg.mk];
    let pct = '';
    if(d && d.changePct != null){
      const v = d.changePct||0;
      pct = (v>=0?'+':'')+v.toFixed(2)+'%' + (cfg.yld ? ' yld' : '');
    }
    const cls = a.dir==='up' ? 'up' : a.dir==='dn' ? 'dn' : 'ne';
    return `<span class="xc ${cls}" title="${cfg.lab}: esperado ${a.dir==='up'?'sube':a.dir==='dn'?'baja':'sin impacto claro'}${pct?' · real '+pct:''}. ${tip}">`
      + `<b>${arrow}</b><span>${cfg.lab}</span>${pct?`<i>${pct}</i>`:''}</span>`;
  }).join('');
  return chips ? `<div class="xcrail">${chips}</div>` : '';
}

async function translateEconTitles(){
  if(econTransRun) return; econTransRun = true;
  try {
    for(;;){
      const batch = econData.filter(e => !e._esT && e.event).slice(0, 30);

function calCountdown(ts){
  const diff = ts - Date.now();
  if(diff <= 0) return null;
  const s = Math.floor(diff/1000);
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  if(h >= 1) return 'en ' + h + 'h ' + String(m).padStart(2,'0') + 'm';
  if(m >= 15) return 'en ' + m + 'm';
  if(m >= 1) return 'en ' + m + 'm ' + String(sec).padStart(2,'0') + 's';
  return 'en ' + (s<10 ? '0'+s : s) + 's';
}

const CALGRID = '58px 48px minmax(150px,1fr) 80px 88px 88px 74px 62px';

// Hora según zona elegida (ET = EE.UU. / CL = Chile UTC-4 / ES = España)

  if(!e.time || isNaN(e.time) || e.time<=0) return esc(e.timeLabel||'--:--');
  if(calTZ==='et') return esc(e.timeLabel||'');
  return new Date(e.time).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',timeZone:calTZName()});
}

    <span class="calcol cact">${e.actual?mark+esc(e.actual):(e.time<=Date.now()&&!e.actual?'<span class="cwait">…</span>':'')}</span>
    <span class="calcol">${e.forecast!=null?esc(e.forecast):''}</span>
    <span class="calcol">${e.previous!=null?esc(e.previous):''}</span>
    <span class="calimp ${impCls}">${impTxt}</span>
    <span class="calstate">${state}</span>
  </div>`;
}

function renderCalendar(el){
  if(!econData.length){
    el.innerHTML=`<div class="loading-msg"><span class="spinner"></span>${lang==='es'?'Cargando calendario económico...':'Loading economic calendar...'}</div>`;
    return;
  }
  // Chips de filtro por divisa (ej. solo USD)
  const counts = {};
  econData.forEach(e => { counts[e.currency||'ALL'] = (counts[e.currency||'ALL']||0)+1; });
  const curs = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  const chips = `<div class="calchips">
    <button class="cchip vchip${calView==='ayer'?' on':''}" onclick="setCalView('ayer')">${lang==='es'?'AYER':'YESTERDAY'}</button>
    <button class="cchip vchip${calView==='hoy'?' on':''}" onclick="setCalView('hoy')">${lang==='es'?'HOY':'TODAY'}</button>
    <button class="cchip vchip${calView==='mañana'?' on':''}" onclick="setCalView('mañana')">${lang==='es'?'MAÑANA':'TOMORROW'}</button>
    <button class="cchip vchip${calView==='semana'?' on':''}" onclick="setCalView('semana')">${lang==='es'?'ESTA SEMANA':'THIS WEEK'}</button>
    <button class="cchip vchip${calView==='proxima'?' on':''}" onclick="setCalView('proxima')">${lang==='es'?'PRÓXIMA SEMANA':'NEXT WEEK'}</button>
    <span class="calspace"></span>
    <button class="cchip tchip${calTZ==='et'?' on':''}" onclick="setCalTZ('et')" title="Hora de EE.UU. (ET)">ET</button>
    <button class="cchip tchip${calTZ==='local'?' on':''}" onclick="setCalTZ('local')" title="Tu hora (Santiago, UTC-4)">CL</button>
    <button class="cchip tchip${calTZ==='madrid'?' on':''}" onclick="setCalTZ('madrid')" title="Hora de España (CET)">ES</button>
    <button class="cchip${calCur==='ALL'?' on':''}" onclick="setCalCur('ALL')">${lang==='es'?'TODAS':'ALL'} <i>${econData.length}</i></button>
    ${curs.map(c=>`<button class="cchip${calCur===c?' on':''}" onclick="setCalCur('${esc(c)}')">${esc(c)} <i>${counts[c]}</i></button>`).join('')}
  </div>`;
  const head = `<div class="calhead" style="grid-template-columns:${CALGRID}">
    <span>${lang==='es'?'HORA':'TIME'}</span>
    <span>${lang==='es'?'DIV.':'CUR.'}</span>
    <span>${lang==='es'?'EVENTO':'EVENT'}</span>
    <span>${lang==='es'?'ACTUAL':'ACTUAL'}</span>
    <span>${lang==='es'?'PREVISIÓN':'FORECAST'}</span>
    <span>${lang==='es'?'ANTERIOR':'PREVIOUS'}</span>
    <span>${lang==='es'?'IMPACTO':'IMPACT'}</span>
    <span></span>
  </div>`;
  const fEcon = calCur==='ALL' ? econData : econData.filter(e => (e.currency||'ALL')===calCur);
  const now = Date.now();
  const hoy = evDateAt(now); // "hoy" según la zona elegida
  const base = new Date(hoy+'T12:00:00');
  const dia = (base.getDay()+6)%7; // 0 = lunes
  const finEsta = new Date(base.getTime() + (6-dia)*86400000).toISOString().slice(0,10);
  const pas=[],pend=[],resto=[],prox=[],ant=[];
  fEcon.forEach(e=>{
    const d = evDate(e);
    if(d===hoy) (e.time<=now?pas:pend).push(e);
    else if(d<hoy) ant.push(e);                    // días anteriores de la semana
    else if(d<=finEsta) resto.push(e);             // solo días futuros de esta semana
    else prox.push(e);
  });
  const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const dayTitle = d => { const b=new Date(d+'T12:00:00'); return DIAS[b.getDay()]+', '+b.getDate()+' de '+MESES[b.getMonth()]+' de '+b.getFullYear(); };
  const orden = evs => evs.slice().sort((a,b)=>a.time-b.time);
  const days = evs => { // agrupar por día (en la zona elegida) los títulos
    let out='';
    let lastD='';
    orden(evs).forEach(e=>{
      const d=evDate(e);
      if(d!==lastD){ lastD=d; out+=`<div class="calsep">${dayTitle(d)}</div>`; }
      out+=calRowHTML(e);
    });
    return out;
  };
  let html = `<div class="calstick">${chips}${head}</div>`;
  const hoySec = () => {
    let h = `<div class="calsec">${lang==='es'?`HOY · PUBLICADOS (${pas.length})`:`TODAY · RELEASED (${pas.length})`}</div>`;
    h += pas.length ? days(pas) : `<div class="calsempty">${lang==='es'?'Sin datos publicados aún hoy':'No data released yet today'}</div>`;
    if(pend.length) h += `<div class="calsec">${lang==='es'?`HOY · PENDIENTES (${pend.length})`:`TODAY · PENDING (${pend.length})`}</div>` + days(pend);
    return h;
  };
  const manana = new Date(base.getTime()+86400000).toISOString().slice(0,10);
  const ayer   = new Date(base.getTime()-86400000).toISOString().slice(0,10);
  if(CVIEWS.includes(calView)===false) calView='semana';
  if(calView==='ayer'){
    const evs = orden(fEcon.filter(e=>evDate(e)===ayer));
    html += `<div class="calsec">${lang==='es'?`AYER (${evs.length})`:`YESTERDAY (${evs.length})`}</div>`;
    html += evs.length ? `<div class="calsep">${dayTitle(ayer)}</div>` + evs.map(e=>calRowHTML(e)).join('') : `<div class="calsempty">${lang==='es'?'Sin datos ayer':'No data yesterday'}</div>`;
  } else if(calView==='hoy'){
    html += hoySec();
  } else if(calView==='mañana'){
    const evsMan = orden(fEcon.filter(e=>evDate(e)===manana));
    html += `<div class="calsec">${lang==='es'?`MAÑANA (${evsMan.length})`:`TOMORROW (${evsMan.length})`}</div>`;
    html += evsMan.length ? `<div class="calsep">${dayTitle(manana)}</div>` + evsMan.map(e=>calRowHTML(e)).join('') : `<div class="calsempty">${lang==='es'?'Sin datos programados mañana':'No events scheduled tomorrow'}</div>`;
  } else if(calView==='proxima'){
    const evsProx = orden(fEcon.filter(e=>evDate(e)>finEsta));
    html += evsProx.length ? `<div class="calsec">${lang==='es'?`PRÓXIMA SEMANA (${evsProx.length})`:`NEXT WEEK (${evsProx.length})`}</div>` + days(evsProx)
                           : `<div class="calsempty">${lang==='es'?'Próxima semana aún no publicada por la fuente (suele salir el fin de semana)':'Next week not published by the source yet (usually out on weekends)'}</div>`;
  } else {
    // Esta semana, orden cronológico: días anteriores → hoy → resto de la semana
    html += hoySec();
    if(resto.length) html += `<div class="calsec">${lang==='es'?'RESTO DE LA SEMANA':'REST OF THE WEEK'}</div>` + days(resto);
    if(ant.length)   html += `<div class="calsec">${lang==='es'?'DÍAS ANTERIORES (publicados)':'EARLIER THIS WEEK (released)'}</div>` + days(ant);
  }
  el.innerHTML = html;
}

function fmtP(sym,p){
  if(p==null||isNaN(p)) return '—';
  if(['US10Y','VIX'].includes(sym)) return p.toFixed(2)+(sym==='US10Y'?'%':'');
  if(sym==='DXY') return p.toFixed(2);
  if(p>1000) return p.toLocaleString('en',{maximumFractionDigits:0});
  return '$'+p.toFixed(2);
}

// ── SESIONES GLOBALES — relojes digitales (Asia · Londres · NY) ──
// Horario de cada bolsa en SU hora local (el DST lo resuelve Intl automáticamente):
// Tokio (TSE) 09:00–18:00 · Londres (LSE) 08:00–16:30 · Nueva York (NYSE) 09:30–16:00
const SESIONES = [
  { key:'asia',    nom:'ASIA',       ciudad:'Tokio',      tz:'Asia/Tokyo',       open:[9,0],   close:[18,0]  },
  { key:'londres', nom:'LONDRES',    ciudad:'Londres',    tz:'Europe/London',    open:[8,0],   close:[16,30] },
  { key:'ny',      nom:'NUEVA YORK', ciudad:'Nueva York', tz:'America/New_York', open:[9,30],  close:[16,0]  },
];

// Hora de pared en una zona horaria (respeta horario de verano vía Intl)
function tzParts(tz, date = new Date()){
  const p = {};
  new Intl.DateTimeFormat('en-US', { timeZone: tz, hour12:false, weekday:'short',
    year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' })
    .formatToParts(date).forEach(x => p[x.type] = x.value);
  return { y:+p.year, mo:+p.month, d:+p.day, wd:p.weekday, h:(+p.hour)%24, m:+p.minute, s:+p.second };
}
function tzOffsetMs(tz, date){
  const ms = (typeof date === 'number') ? date : date.getTime();
  const p = tzParts(tz, ms);
  return Date.UTC(p.y, p.mo-1, p.d, p.h, p.m, p.s) - Math.floor(ms/1000)*1000;
}
// Instante UTC que corresponde a una hora de pared en tz (pasadas de corrección DST)
function wallToUTC(tz, y, mo, d, h, mi){
  const guess = Date.UTC(y, mo-1, d, h, mi, 0);
  let t = guess;
  for (let i=0; i<3; i++) t = guess - tzOffsetMs(tz, t);
  return t;
}
function fmtFalta(ms){
  if (ms <= 0) return null;
  const s  = Math.round(ms/1000);
  const d  = Math.floor(s/86400);
  const h  = Math.floor((s%86400)/3600), m = Math.floor((s%3600)/60), sec = s%60;
  if (s >= 86400) return d + 'd ' + h + 'h';
  return h >= 1 ? h + 'h ' + String(m).padStart(2,'0') + 'm'
       : m >= 1 ? m + 'm ' + String(sec).padStart(2,'0') + 's'
       : sec + 's';
}
// Estado de la sesión: {abierta, faltaMs, abre|cierra (instante UTC)}
function sesionEstado(s, now = Date.now()){
  const p = tzParts(s.tz);
  const dow  = {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[p.wd];
  const o    = s.open[0]*60 + s.open[1];
  const c    = s.close[0]*60 + s.close[1];
  const nm   = p.h*60 + p.m;
  if (dow >= 1 && dow <= 5 && nm >= o && nm < c){
    const cierra = wallToUTC(s.tz, p.y, p.mo, p.d, s.close[0], s.close[1]);
    return { abierta:true, faltaMs: cierra - now, cierra };
  }
  // próxima apertura: salta fines de semana (hasta 9 días de recorrido)
  for (let k = 0; k < 9; k++){
    const wd = new Date(Date.UTC(p.y, p.mo-1, p.d + k)).getUTCDay();
    if (wd === 0 || wd === 6) continue;
    const t = wallToUTC(s.tz, p.y, p.mo, p.d + k, s.open[0], s.open[1]);
    if (t > now) return { abierta:false, faltaMs: t - now, abre: t };
  }
  return { abierta:false, faltaMs: 0 };
}

// Transición a ABIERTA → aviso una vez por sesión y día (banner)
const sesAvisoDia = new Map(); // key sesion|fechaWall → true
function renderSesiones(){
  const row = document.getElementById('sesRow'); if(!row) return;
  // Zona horaria elegida del calendario (ET/CL/ES); default = tu hora local
  const fx = (() => {
    let eff = (typeof calTZName === 'function') ? calTZName() : null;
    try { new Intl.DateTimeFormat('es-ES', { timeZone: eff || 'UTC' }); }
    catch { eff = Intl.DateTimeFormat().resolvedOptions().timeZone; }
    eff = eff || Intl.DateTimeFormat().resolvedOptions().timeZone;
    return { znEff: eff, label: ({'America/New_York':'ET','Europe/Madrid':'ES'}[eff] || 'CL') };
  })();
  const fmtMiZona = ms => new Intl.DateTimeFormat('es-ES', { hour:'2-digit', minute:'2-digit', timeZone:fx.znEff }).format(ms);
  row.innerHTML = SESIONES.map(s => {
    const st = sesionEstado(s);
    const p  = tzParts(s.tz);
    const dig = String(p.h).padStart(2,'0') + ':' + String(p.m).padStart(2,'0') + ':' + String(p.s).padStart(2,'0');
    const falta = fmtFalta(st.faltaMs);
    const cnt = !falta ? '' : (st.abierta
      ? (lang==='es' ? '⏳ cierra en ' : '⏳ closes in ') + falta
      : (lang==='es' ? '🕒 abre en '   : '🕒 opens in ')  + falta);
    // Horario de apertura/cierre: hora LOCAL de la plaza + hora del usuario (zona elegida)
    const abreUTC0   = wallToUTC(s.tz, p.y, p.mo, p.d, s.open[0],  s.open[1]);
    const cierraUTC0 = wallToUTC(s.tz, p.y, p.mo, p.d, s.close[0], s.close[1]);
    const hhmm = ([h, m2]) => String(h).padStart(2,'0') + ':' + String(m2).padStart(2,'0');
    const abreLocal  = hhmm(s.open);
    const cierraLocal = hhmm(s.close);
    const lv = lang==='es' ? 'L-V' : 'M-F';
    const abreTxt  = lang==='es' ? 'abre' : 'opens';
    const cierraTxt = lang==='es' ? 'cierra' : 'closes';
    const hzLocal  = abreTxt + ' <b>' + abreLocal + '</b> · ' + cierraTxt + ' <b>' + cierraLocal + '</b>';
    const hzMiZona = '<i>' + lv + '</i> ' + fmtMiZona(abreUTC0) + '–' + fmtMiZona(cierraUTC0) + ' <i>' + fx.label + '</i>';
    const estTx = st.abierta ? (lang==='es'?'ABIERTA':'OPEN') : (lang==='es'?'CERRADA':'CLOSED');
    // Aviso de apertura en el cruce de hora
    const diaWall = p.y + '-' + p.mo + '-' + p.d;
    const avKey = s.key + '|' + diaWall;
    if (st.abierta && !sesAvisoDia.has(avKey)){
      sesAvisoDia.set(avKey, true);
      showBanner((lang==='es' ? '🔔 Abre la sesión de ' : '🔔 Session opens: ') + s.ciudad + ' (' + s.nom + ')', false);
    }
    return `<div class="sesclock ${st.abierta?'abierto':'cerrada'}" title="${esc(s.ciudad)} (${esc(s.tz)}) · horario local de la bolsa ${s.open[0]}:${esc(String(s.open[1]).padStart(2,'0'))}–${s.close[0]}:${esc(String(s.close[1]).padStart(2,'0'))}">
      <div class="sesid">
        <div class="sesnom">${esc(s.nom)}</div>
        <div class="sesciudad">${esc(s.ciudad)} · ${esc(s.tz.split('/')[1].replace(/_/g,' '))}</div>
        <div class="sesdig">${dig}<small> ${esc(s.tz.split('/')[1].replace(/_/g,' '))}</small></div>
      </div>
      <div class="sesdif">
        <span class="sesst ${st.abierta?'so':'sc'}">${estTx}</span>
        <span class="sescnt">${cnt}</span>
        <span class="seshz">${hzLocal}</span>
        <span class="seshz2">${hzMiZona}</span>
      </div>
    </div>`;
  }).join('');
}

// ── CLOCK ─────────────────────────────────────────────────
function updateClock(){
  const et=new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));
  const h=String(et.getHours()).padStart(2,'0'),m=String(et.getMinutes()).padStart(2,'0'),s=String(et.getSeconds()).padStart(2,'0');
  document.getElementById('clk').textContent=`${h}:${m}:${s} ET`;
  // Badge NY del header: horario real de NYSE (09:30–16:00 con DST) en vez del cálculo viejo
  const stNY = sesionEstado(SESIONES[2]);
  const nb=document.getElementById('nyBadge');
  nb.textContent=stNY.abierta?t('nyOpen'):t('nyClosed');
  nb.className='badge '+(stNY.abierta?'bg':'br');
  renderSesiones();
}

// Ráfaga de refrescos tras la publicación: el "real" puede tardar unos segundos
// en aparecer en la fuente; sondear bien durante el primer minuto y medio
let calBurstTimers = [];
function scheduleReleaseBurst(){
  calBurstTimers.forEach(t => clearTimeout(t));
  calBurstTimers = [3, 20, 45, 70, 100].map(s => setTimeout(loadCalendar, s * 1000));
}

// Auto-recarga de la UI cuando el servidor se actualiza (evita scripts viejos)
async function watchUi(){
  try {
    const s = await api('/status');
    if (s && s.uiStamp) {
      const prev = localStorage.getItem('uiStamp');
      if (prev && prev !== String(s.uiStamp)) {
        localStorage.setItem('uiStamp', String(s.uiStamp));
        location.reload();
        return;
      }
      localStorage.setItem('uiStamp', String(s.uiStamp));
    }
  } catch {}
}
watchUi();
setInterval(watchUi, 60000);

// Cuenta atrás por segundo (como Reuters): urgency por color y PARPADEO en los últimos 10s
setInterval(() => {
  if(activeTab !== 6) return;
  const now = Date.now();
  let released = false;
  document.querySelectorAll('.ucnt').forEach(sp => {
    const ts = Number(sp.dataset.ts);
    const rem = ts - now;
    if(rem <= 0){
      if(!sp.dataset.done){ sp.dataset.done = '1'; sp.className = 'calcnt cnturgent'; sp.textContent = lang==='es' ? 'PUBLICANDO…' : 'PUBLISHING…'; released = true; }
      return;
    }
    if(sp.dataset.done){ delete sp.dataset.done; }
    sp.textContent = calCountdown(ts);
    sp.classList.toggle('cntwarn',  rem <= 60*60000);
    sp.classList.toggle('cnturgent', rem <= 15*60000);
    sp.classList.toggle('cntblink', rem <= 10000);
  });
  // un dato acaba de cruzar la hora → ráfaga de refrescos para traer el REAL ya
  if(released){ setTimeout(loadCalendar, 800); scheduleReleaseBurst(); }
}, 1000);
