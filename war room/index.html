<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading War Room — NAS100 Live</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--bg2:#111111;--bg3:#1a1a1a;
  --bd:#2a2a2a;--bd2:#333333;--bd3:#3d3d3d;
  --tx:#e0e0e0;--tx2:#999999;--tx3:#666666;--tx4:#444444;
  --gn:#22c55e;--rd:#ef4444;--am:#f59e0b;
  --bl:#3b82f6;--pu:#8b5cf6;--or:#f97316
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:13px}

/* HEADER */
.hdr{background:var(--bg2);border-bottom:1px solid var(--bd);padding:8px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.logo{font-size:13px;font-weight:600;letter-spacing:.04em;color:#f8fafc}.logo b{color:var(--am)}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;animation:pulse 1.4s infinite}
.dot.live{background:var(--gn)}.dot.loading{background:var(--am)}.dot.error{background:var(--rd)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.badge{font-size:9px;font-weight:600;padding:2px 7px;border-radius:3px;white-space:nowrap}
.bg{background:#052e16;color:var(--gn)}.br{background:#1c0000;color:var(--rd)}
.ba{background:#1a1000;color:var(--am)}.bb{background:#0a1628;color:var(--bl)}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:6px}
.clk{font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums}
.lbtn{background:var(--bg3);border:1px solid var(--bd2);border-radius:4px;padding:3px 9px;font-size:10px;font-weight:600;color:var(--tx2);cursor:pointer;transition:all .15s}
.lbtn:hover{background:var(--bd)}.lbtn.on{background:var(--am);color:#000;border-color:var(--am)}
.free-badge{font-size:9px;background:#052e16;color:var(--gn);padding:2px 6px;border-radius:3px;border:1px solid #166534}
.src-info{font-size:9px;color:var(--tx4)}

/* BANNER */
.banner{background:#1a1a1a;border-bottom:1px solid #333333;padding:6px 14px;display:none;align-items:center;gap:8px;font-size:11px;color:#cccccc;flex-shrink:0}
.banner.show{display:flex}
.bdot{width:6px;height:6px;border-radius:50%;background:var(--or);animation:pulse .7s infinite;flex-shrink:0}

/* IMPACT BOX */
.ibox{background:var(--bg2);border-bottom:1px solid var(--bd);padding:9px 12px;flex-shrink:0}
.ibox-hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.ibox-title{font-size:9px;color:var(--tx3);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.ibox-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px}
.icard{background:var(--bg3);border:1px solid var(--bd);border-radius:6px;padding:8px 10px}
.icard.bull{border-color:#166534;background:#021a0c}.icard.bear{border-color:#7f1d1d;background:#1a0202}
.ic-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.ic-src{font-size:9px;color:var(--tx3)}.ic-dir{font-size:11px;font-weight:600}
.up{color:var(--gn)}.dn{color:var(--rd)}.ne{color:var(--am)}
.ic-event{font-size:11px;color:var(--tx2);line-height:1.35;margin-bottom:3px}
.ic-analysis{font-size:10px;color:var(--tx3);line-height:1.4;margin-bottom:3px}
.ic-mag{font-size:10px;font-weight:600}
.mg-h{color:var(--rd)}.mg-m{color:var(--am)}.mg-l{color:var(--bl)}
.cbar{height:3px;background:var(--bd);border-radius:2px;margin-top:4px;overflow:hidden}
.cfill{height:100%;border-radius:2px}
.ic-conf{font-size:9px;color:var(--tx4);margin-top:2px}

/* BODY */
.body{display:grid;grid-template-columns:1fr 275px;flex:1;overflow:hidden;min-height:0}

/* FEED */
.feed{display:flex;flex-direction:column;border-right:1px solid var(--bd);overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--bd);flex-shrink:0;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 12px;font-size:10px;color:var(--tx3);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--tx2)}.tab.on{color:var(--am);border-bottom-color:var(--am);font-weight:600}
.srow{display:flex;gap:5px;padding:7px 7px 3px;flex-shrink:0}
.srow input{flex:1;background:var(--bg3);border:1px solid var(--bd);border-radius:4px;padding:5px 9px;font-size:11px;color:var(--tx);outline:none}
.srow input::placeholder{color:var(--tx4)}.srow input:focus{border-color:var(--bd3)}
.rbtn{background:var(--bd);border:none;color:var(--am);padding:5px 10px;border-radius:4px;font-size:11px;cursor:pointer}
.rbtn:hover{background:var(--bd3)}
.flist{flex:1;overflow-y:auto;padding:5px}
.flist::-webkit-scrollbar{width:3px}.flist::-webkit-scrollbar-thumb{background:var(--bd)}

/* LOADING */
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--bd);border-top-color:var(--am);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-msg{text-align:center;color:var(--tx4);font-size:12px;padding:30px 0}

/* NEWS CARD */
.nc{background:var(--bg2);border:1px solid var(--bd);border-radius:6px;padding:8px 9px;margin-bottom:5px;animation:si .2s ease;cursor:pointer;transition:border-color .15s}
.nc:hover{border-color:var(--bd3)}
@keyframes si{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.nc.c{border-left:3px solid var(--rd)}.nc.h{border-left:3px solid var(--am)}
.nc.m{border-left:3px solid var(--bl)}.nc.l{border-left:3px solid var(--bd)}
.nc-top{display:flex;align-items:center;gap:5px;margin-bottom:4px;flex-wrap:wrap}
.src{font-size:9px;font-weight:700;padding:2px 5px;border-radius:3px}
.sr{background:#333333;color:#cccccc}.st{background:#333333;color:#cccccc}
.sf{background:#222222;color:#cccccc}.sb{background:#333333;color:#cccccc}
.sa{background:#7f1d1d;color:#fca5a5}.sc{background:#1a1a2e;color:#a0a8c0}
.sy{background:#0a1628;color:#93c5fd}.si{background:#0d2010;color:#86efac}
.ss{background:#1a0040;color:#c4b5fd}.sbl{background:#0d1626;color:#93c5fd}
.sw{background:#1a1a1a;color:#e5e7eb}.sbr{background:#1a0a00;color:#fcd34d}
.ib{font-size:9px;font-weight:700;padding:2px 5px;border-radius:3px}
.ibc{background:var(--rd);color:#fff}.ibh{background:var(--am);color:#000}
.ibm{background:var(--bl);color:#fff}.ibl{background:var(--bd);color:var(--tx3)}
.ago{font-size:9px;color:var(--tx4);margin-left:auto}
.nc-title{font-size:11px;color:#e2e8f0;line-height:1.4;font-weight:500;margin-bottom:3px}
.nc-body{font-size:10px;color:var(--tx3);line-height:1.4;margin-bottom:4px}
.nc-imp{display:flex;align-items:flex-start;gap:5px;background:var(--bg3);border-radius:4px;padding:4px 7px;margin:4px 0;border:1px solid var(--bd)}
.nc-link{font-size:9px;color:var(--bl);text-decoration:none;opacity:.7}.nc-link:hover{opacity:1}
.ntag{font-size:9px;background:#0f172a;color:var(--tx3);padding:1px 5px;border-radius:2px}
.nt-n{color:var(--gn);background:#021a0c}.nt-v{color:var(--am);background:#1a1000}
.nt-c{color:var(--rd);background:#1a0000}

/* TRUMP CARD — base */
.tc{border-radius:6px;padding:8px 9px;margin-bottom:5px;animation:si .2s ease;border:1px solid}
/* Posts DIRECTOS de @realDonaldTrump — azul patriótico */
.tc.direct{background:#111111;border-color:#333333;box-shadow:inset 3px 0 0 #555555}
/* Posts de otras fuentes citando a Trump — naranja original */
.tc.indirect{background:#0a0500;border-color:#431407;box-shadow:inset 3px 0 0 #c2410c}
.tc-h{display:flex;align-items:center;gap:6px;margin-bottom:5px}
/* Avatar directo = azul bandera USA */
.tc-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.tc-av.direct{background:#1d4ed8;border:2px solid #3b82f6}
.tc-av.indirect{background:#c2410c;border:2px solid #ea580c}
/* Nombre y handle */
.tc-name.direct{font-size:11px;font-weight:700;color:#60a5fa}
.tc-name.indirect{font-size:11px;font-weight:600;color:var(--am)}
.tc-handle.direct{font-size:9px;color:#1e40af}
.tc-handle.indirect{font-size:9px;color:#555555}
/* Badge "DIRECTO" */
.tc-official{font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;display:flex;align-items:center;gap:3px;white-space:nowrap}
.tc-official.direct{background:#333333;color:#cccccc;border:1px solid #555555}
.tc-official.indirect{background:#431407;color:#fb923c}
.tc-body.direct{font-size:11px;color:#bfdbfe;line-height:1.55;margin-bottom:5px}
.tc-body.indirect{font-size:11px;color:#fed7aa;line-height:1.55;margin-bottom:5px}
.tc-foot{display:flex;gap:8px;font-size:9px;align-items:center}
.tc-foot.direct{color:#555555}
.tc-foot.indirect{color:#78350f}
/* Barra superior de color en cards directas */
.tc-topbar{height:3px;border-radius:3px 3px 0 0;margin:-8px -9px 8px;display:block}
.tc-topbar.direct{background:linear-gradient(90deg,#b91c1c 33%,#fff 33% 66%,#1d4ed8 66%)}
.tc-topbar.indirect{background:#333333}

/* SQUAWK CARDS — @DeItaone @FirstSquawk @LiveSquawk */
.sq{border-radius:6px;padding:8px 9px;margin-bottom:5px;animation:si .2s ease;border:1px solid}
.sq-delta  {background:#0d0520;border-color:#4c1d95;box-shadow:inset 3px 0 0 #7c3aed}
.sq-first  {background:#001828;border-color:#0c4a6e;box-shadow:inset 3px 0 0 #0ea5e9}
.sq-live   {background:#001810;border-color:#064e3b;box-shadow:inset 3px 0 0 #10b981}
.sq-h{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.sq-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.sq-av.delta{background:#7c3aed}.sq-av.first{background:#0ea5e9}.sq-av.live{background:#10b981}
.sq-name{font-size:11px;font-weight:700}.sq-handle{font-size:9px;opacity:.6}
.sq-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;display:flex;align-items:center;gap:3px;white-space:nowrap;margin-left:auto}
.sq-badge.delta{background:#4c1d95;color:#c4b5fd;border:1px solid #7c3aed}
.sq-badge.first{background:#0c4a6e;color:#7dd3fc;border:1px solid #0ea5e9}
.sq-badge.live {background:#064e3b;color:#6ee7b7;border:1px solid #10b981}
.sq-body{font-size:11px;line-height:1.55;margin-bottom:5px}
.sq-body.delta{color:#ddd6fe}.sq-body.first{color:#bae6fd}.sq-body.live{color:#a7f3d0}
.sq-topbar{height:3px;border-radius:3px 3px 0 0;margin:-8px -9px 8px;display:block}
.sq-foot{display:flex;gap:8px;font-size:9px;align-items:center;opacity:.6}
/* X logo en SVG */
.x-icon{width:11px;height:11px;flex-shrink:0}
.side{display:flex;flex-direction:column;overflow:hidden}
.sblk{border-bottom:1px solid var(--bd);padding:9px 11px;flex-shrink:0}
.sblk.gr{flex:1;overflow-y:auto}.sblk.gr::-webkit-scrollbar{width:3px}.sblk.gr::-webkit-scrollbar-thumb{background:var(--bd)}
.sb-title{font-size:9px;color:var(--tx4);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:5px}
.live-pill{font-size:8px;background:#052e16;color:var(--gn);padding:1px 4px;border-radius:2px}
.mr{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid #222222;gap:4px}
.ms{font-size:10px;color:var(--tx2)}.mv{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}.mc{font-size:9px;font-variant-numeric:tabular-nums}
.ci{display:flex;gap:6px;padding:4px 0;border-bottom:1px solid #222222;align-items:flex-start}
.ct{font-size:9px;min-width:34px;padding-top:2px;flex-shrink:0;font-variant-numeric:tabular-nums}
.cd{width:5px;height:5px;border-radius:50%;margin-top:4px;flex-shrink:0}
.cl{font-size:10px;color:#cbd5e1;line-height:1.3}.cs{font-size:9px;color:var(--tx3)}
.ali{display:flex;align-items:flex-start;gap:5px;padding:4px 0;border-bottom:1px solid #222222}
.al-i{font-size:12px;flex-shrink:0;margin-top:1px}.al-t{font-size:10px;color:var(--tx2);line-height:1.3;flex:1}.al-a{font-size:9px;color:var(--tx4);white-space:nowrap}

/* TICKER */
.ticker{background:#0a0a0a;border-top:1px solid var(--bd);padding:5px 9px;display:flex;gap:14px;overflow-x:auto;white-space:nowrap;flex-shrink:0}
.ticker::-webkit-scrollbar{display:none}
.tk{display:flex;gap:4px;align-items:center;font-size:10px}.tks{color:var(--tx3);font-weight:600}

/* ERROR STATE */
.err-box{background:#1a1a1a;border:1px solid #333333;border-radius:6px;padding:16px;margin:12px;color:#cccccc;font-size:11px;line-height:1.7}
.err-box code{background:#0d0300;padding:2px 6px;border-radius:3px;font-family:monospace;font-size:10px;color:#fb923c}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="dot live" id="statusDot"></div>
  <div class="logo">TRADING <b>WAR ROOM</b> — NAS100</div>
  <div class="badge bg" id="nyBadge">NY OPEN</div>
  <div class="badge br" id="vixBadge">VIX —</div>
  <div class="badge ba" id="evtBadge" style="display:none"></div>
  <span class="free-badge">FREE · Sin API keys</span>
  <div class="src-info" id="srcInfo"></div>
  <div class="hdr-r">
    <button class="lbtn on" id="btnEs" onclick="setLang('es')">ES</button>
    <button class="lbtn"    id="btnEn" onclick="setLang('en')">EN</button>
    <div class="clk" id="clk">--:--:-- ET</div>
  </div>
</div>

<!-- ALERT BANNER -->
<div class="banner" id="banner">
  <div class="bdot"></div>
  <span id="bannerTxt"></span>
  <button onclick="this.parentElement.classList.remove('show')" style="margin-left:auto;background:none;border:none;color:#555555;cursor:pointer;font-size:14px">✕</button>
</div>

<!-- NAS100 IMPACT -->
<div class="ibox">
  <div class="ibox-hdr">
    <div class="ibox-title" id="iboxTitle">Análisis de impacto NAS100</div>
    <div class="badge bb" id="overallBadge">—</div>
    <div style="font-size:9px;color:var(--tx4)" id="lastUpd"></div>
  </div>
  <div class="ibox-cards" id="iCards">
    <div class="loading-msg"><span class="spinner"></span>Conectando al servidor...</div>
  </div>
</div>

<!-- BODY -->
<div class="body">
  <div class="feed">
    <div class="tabs" id="tabRow"></div>
    <div class="srow">
      <input type="text" id="srch" oninput="renderFeed()" placeholder="Buscar noticias...">
      <button class="rbtn" onclick="hardRefresh()">↺</button>
    </div>
    <div class="flist" id="flist">
      <div class="loading-msg"><span class="spinner"></span>Cargando noticias en vivo...</div>
    </div>
  </div>

  <div class="side">
    <div class="sblk">
      <div class="sb-title"><span id="mktTit">Mercados</span><span class="live-pill">LIVE</span></div>
      <div id="mktP"><div class="loading-msg" style="padding:8px 0;font-size:10px">Cargando precios...</div></div>
    </div>
    <div class="sblk">
      <div class="sb-title" id="calTit">Calendario hoy</div>
      <div id="calP"></div>
    </div>
    <div class="sblk gr">
      <div class="sb-title" id="alTit">Alertas</div>
      <div id="alP"></div>
    </div>
  </div>
</div>

<!-- TICKER -->
<div class="ticker" id="tkRow">
  <span style="font-size:10px;color:var(--tx4)">Cargando precios...</span>
</div>

<script>
const API = 'http://localhost:3001/api';

const TL = {
  es:{
    nyOpen:'NY ABIERTO', nyClosed:'NY CERRADO',
    iboxTitle:'Análisis de impacto NAS100 — Noticias en vivo',
    bull:'SESGO ALCISTA ▲', bear:'SESGO BAJISTA ▼', neu:'SESGO NEUTRO',
    mktTit:'Mercados en tiempo real', calTit:'Calendario hoy', alTit:'Alertas activas',
    ph:'Buscar noticias...',
    impUp:'NAS100 AL ALZA ▲', impDn:'NAS100 A LA BAJA ▼', impNeu:'IMPACTO NEUTRO',
    magH:'Magnitud ALTA', magM:'Magnitud MEDIA', magL:'Magnitud BAJA',
    conf:'Confianza', crit:'CRÍTICO', high:'ALTO', med:'MEDIO', low:'BAJO',
    now:'ahora', m:'m', h:'h',
    tabs:['Todo','🎙 Trump / Truth Social','Reuters / AP','Fed / Macro','Mercados / Tech','⚡ Squawk X'],
    noServer:`<div class="err-box">
      <b>⚠ Servidor no encontrado</b><br><br>
      Abre una terminal en la carpeta <code>warroom</code> y ejecuta:<br><br>
      <code>node server.js</code><br><br>
      Luego recarga esta página. El servidor agrega 22 feeds RSS gratuitos en tiempo real.
    </div>`,
    upd:'Actualizado'
  },
  en:{
    nyOpen:'NY OPEN', nyClosed:'NY CLOSED',
    iboxTitle:'NAS100 Impact Analysis — Live News',
    bull:'BULLISH BIAS ▲', bear:'BEARISH BIAS ▼', neu:'NEUTRAL BIAS',
    mktTit:'Live Markets', calTit:"Today's Calendar", alTit:'Active Alerts',
    ph:'Search news...',
    impUp:'NAS100 HIGHER ▲', impDn:'NAS100 LOWER ▼', impNeu:'NEUTRAL IMPACT',
    magH:'HIGH Magnitude', magM:'MED Magnitude', magL:'LOW Magnitude',
    conf:'Confidence', crit:'CRITICAL', high:'HIGH', med:'MED', low:'LOW',
    now:'now', m:'m', h:'h',
    tabs:['All','🎙 Trump / Truth Social','Reuters / AP','Fed / Macro','Markets / Tech','⚡ Squawk X'],
    noServer:`<div class="err-box">
      <b>⚠ Server not found</b><br><br>
      Open a terminal in the <code>warroom</code> folder and run:<br><br>
      <code>node server.js</code><br><br>
      Then reload this page. The server aggregates 22 free RSS feeds in real time.
    </div>`,
    upd:'Updated'
  }
};

let lang = 'es', activeTab = 0, allNews = [], mktData = {}, serverOk = false;
const t = k => TL[lang][k] || k;

// ── TRADUCCIÓN GRATUITA vía Google Translate ────────────────
const translationCache = new Map();
async function translateText(text, from, to) {
  if (!text || !text.trim()) return text;
  const key = `${to}:${text}`;
  if (translationCache.has(key)) return translationCache.get(key);
  try {
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURIComponent(text)}`;
    const res = await fetch(url);
    if (!res.ok) return text;
    const data = await res.json();
    const translated = data[0].map(s => s[0]).join('');
    translationCache.set(key, translated);
    return translated;
  } catch { return text; }
}
async function translateNews(items) {
  if (lang !== 'es') return;
  const batch = items.slice(0, 40);
  await Promise.allSettled(batch.map(async (n) => {
    if (n._translatedEs) return;
    if (n.title && !n._origTitle) { n._origTitle = n.title; n.title = await translateText(n.title, 'en', 'es'); }
    if (n.body && !n._origBody)  { n._origBody = n.body;   n.body = await translateText(n.body, 'en', 'es'); }
    n._translatedEs = true;
  }));
}

// ── API ────────────────────────────────────────────────────
async function api(ep, qs=''){
  const r = await fetch(`${API}${ep}${qs}`, { signal: AbortSignal.timeout(10000) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function loadNews(){
  try {
    setDot('loading');
    const d = await api('/news');
    allNews  = d.items || [];
    serverOk = true;
    setDot('live');
    document.getElementById('srcInfo').textContent = allNews.length + (lang==='es'?' artículos · ':' articles · ') + [...new Set(allNews.map(n=>n.src))].length + (lang==='es'?' fuentes':' sources');
    if(lang==='es') await translateNews(allNews);
    renderFeed();
    loadImpact();
    buildAlerts();
    checkBreaking();
  } catch {
    serverOk = false;
    setDot('error');
    document.getElementById('flist').innerHTML = t('noServer');
    document.getElementById('iCards').innerHTML = '<div class="loading-msg" style="font-size:10px;color:var(--tx4)">Sin conexión</div>';
  }
}

async function loadMarkets(){
  try {
    const d = await api('/markets');
    mktData  = d.prices || {};
    renderMkt();
    renderTicker();
    const vix = mktData['VIX'];
    if(vix && vix.price){
      const vb = document.getElementById('vixBadge');
      vb.textContent = 'VIX ' + vix.price.toFixed(1);

function renderImpact(data){
  const items = data?.topImpact || allNews.filter(n=>n.nasDir&&n.nasDir!=='neu').slice(0,4);
  const bias  = data?.bias || computeBias();
  const now   = new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});

  const ob = document.getElementById('overallBadge');
  ob.textContent = bias==='bull'?t('bull'):bias==='bear'?t('bear'):t('neu');
  ob.className   = 'badge '+(bias==='bull'?'bg':bias==='bear'?'br':'ba');
  document.getElementById('iboxTitle').textContent = t('iboxTitle');
  document.getElementById('lastUpd').textContent   = t('upd')+' '+now;

  if(!items.length){
    const msg = lang==='es'?'Sin noticias de impacto en las últimas 2h':'No high-impact news in the last 2h';
    document.getElementById('iCards').innerHTML=`<div class="loading-msg" style="font-size:10px">${msg}</div>`;
    return;
  }
  document.getElementById('iCards').innerHTML = items.slice(0,4).map(n=>{
    const bull=n.nasDir==='bull', bear=n.nasDir==='bear';
    const col =bull?'#22c55e':bear?'#ef4444':'#f59e0b';
    const dir =bull?t('impUp'):bear?t('impDn'):t('impNeu');
    const ana =lang==='es'?(n.nasEs||''):(n.nasEn||'');
    const mag =n.nasMag==='high'?t('magH'):n.nasMag==='med'?t('magM'):t('magL');
    const magC=n.nasMag==='high'?'mg-h':n.nasMag==='med'?'mg-m':'mg-l';
    const ttl =(n.title||'').slice(0,65);
    const conf=n.conf||60;
    return `<div class="icard ${bull?'bull':bear?'bear':''}">
      <div class="ic-top"><span class="ic-src">${n.src}</span>
        <span class="ic-dir ${bull?'up':bear?'dn':'ne'}">${bull?'▲':bear?'▼':'◆'} ${dir}</span>
      </div>
      <div class="ic-event">${ttl}${ttl.length>=65?'…':''}</div>
      ${ana?`<div class="ic-analysis">${ana}</div>`:''}
      <div class="ic-mag ${magC}">${mag}</div>
      <div class="cbar"><div class="cfill" style="width:${conf}%;background:${col}"></div></div>
      <div class="ic-conf">${t('conf')}: ${conf}%</div>
    </div>`;
  }).join('');
}

function computeBias(){
  const r=allNews.filter(n=>Date.now()-n.ts<7200000);
  let bull=0,bear=0;
  r.forEach(n=>{const w=n.imp==='c'?3:n.imp==='h'?2:1;if(n.nasDir==='bull')bull+=w;else if(n.nasDir==='bear')bear+=w;});
  return bull>bear+3?'bull':bear>bull+3?'bear':'neu';
}

const FILTERS=[
  _=>true,
  n=>n.trump||n.cat==='trump',
  n=>['general'].includes(n.cat)||/REUTERS|AP/.test(n.src),

function ago(ts){
  const d=Math.floor((Date.now()-(ts||0))/60000);
  if(d<1) return t('now');
  if(d<60) return d+t('m');
  return Math.floor(d/60)+t('h');
}
function ibadge(i){
  const m={c:[t('crit'),'ibc'],h:[t('high'),'ibh'],m:[t('med'),'ibm'],l:[t('low'),'ibl']};
  const[tx,cl]=m[i]||['','ibl'];
  return `<span class="ib ${cl}">${tx}</span>`;
}
function tagCl(g){return g==='NAS100'||g==='RALLY'?'nt-n':g==='VOL'?'nt-v':g==='CRASH'?'nt-c':'';}

function impMini(n){
  if(!n.nasDir||n.nasDir==='neu') return '';

const MKT_ORDER=['NAS100','SPX','DOW','VIX','DXY','US10Y','GOLD','CRUDE','NVDA','AAPL','MSFT','BTC'];
function fmtP(sym,p){
  if(p==null||isNaN(p)) return '—';
  if(['US10Y','VIX'].includes(sym)) return p.toFixed(2)+(sym==='US10Y'?'%':'');
  if(sym==='DXY') return p.toFixed(2);
  if(p>1000) return p.toLocaleString('en',{maximumFractionDigits:0});
  return '$'+p.toFixed(2);
}
function renderMkt(){
  document.getElementById('mktP').innerHTML=MKT_ORDER.map(sym=>{
    const d=mktData[sym]; if(!d) return '';
    const pct=(d.changePct||0), dir=pct>=0?'up':'dn';
    return `<div class="mr">
      <span class="ms">${sym}</span>
      <span class="mv ${dir}">${fmtP(sym,d.price)}</span>
      <span class="mc ${dir}">${pct>=0?'+':''}${pct.toFixed(2)}%</span>
    </div>`;
  }).filter(Boolean).join('');
  document.getElementById('mktTit').textContent=t('mktTit');
}
function renderTicker(){
  const syms=['NAS100','SPX','VIX','DXY','US10Y','NVDA','AAPL','META','MSFT','GOOGL','AMZN','TSLA','AMD','GOLD','CRUDE','BTC'];
  const parts=syms.map(sym=>{
    const d=mktData[sym]; if(!d||d.price==null) return '';
    const dir=(d.changePct||0)>=0?'up':'dn';
    const pct=((d.changePct||0)>=0?'+':'')+(d.changePct||0).toFixed(2)+'%';
    return `<div class="tk"><span class="tks">${sym}</span><span class="${dir}">${fmtP(sym,d.price)}</span><span class="${dir}" style="font-size:9px">${pct}</span></div>`;
  }).filter(Boolean);
  document.getElementById('tkRow').innerHTML=parts.length?parts.join(''):`<span style="font-size:10px;color:var(--tx4)">${lang==='es'?'Iniciando servidor...':'Starting server...'}</span>`;
}

function checkBreaking(){
  const crit=allNews.filter(n=>n.imp==='c'&&Date.now()-n.ts<600000);
  if(!crit.length) return;
  const top=crit[0];
  if(top.trumpDirect){
    showBanner('🇺🇸 TRUMP DIRECTO: '+top.title.slice(0,100), true);
    const eb=document.getElementById('evtBadge');
    eb.style.display='inline';
    eb.textContent='🇺🇸 TRUMP LIVE';
    eb.style.background='#333333';
    eb.style.color='#93c5fd';
  } else {
    showBanner('🔴 '+(top.trump?'TRUMP: ':'')+top.title.slice(0,100), false);
    if(top.trump){const eb=document.getElementById('evtBadge');eb.style.display='inline';eb.textContent='⚠ TRUMP';}
  }
}

function showBanner(txt, isDirect=false){
  const b=document.getElementById('banner'),t2=document.getElementById('bannerTxt');
  if(!b||!t2) return;
  t2.textContent=txt;
  b.style.background = isDirect ? '#111111' : '#1a1a1a';
  b.style.borderColor = isDirect ? '#333333' : '#333333';
  t2.style.color = isDirect ? '#93c5fd' : '#fed7aa';
  b.classList.add('show');
  setTimeout(()=>b.classList.remove('show'),18000);
}

// ── CLOCK ─────────────────────────────────────────────────
function updateClock(){
  const et=new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));
  const h=String(et.getHours()).padStart(2,'0'),m=String(et.getMinutes()).padStart(2,'0'),s=String(et.getSeconds()).padStart(2,'0');
  document.getElementById('clk').textContent=`${h}:${m}:${s} ET`;
  const isNY=et.getHours()>=9&&(et.getHours()<11||(et.getHours()===11&&et.getMinutes()===0));
  const nb=document.getElementById('nyBadge');
  nb.textContent=isNY?t('nyOpen'):t('nyClosed');
  nb.className='badge '+(isNY?'bg':'br');
}

async function hardRefresh(){
  setDot('loading');
  document.getElementById('flist').innerHTML=`<div class="loading-msg"><span class="spinner"></span>${lang==='es'?'Actualizando...':'Refreshing...'}</div>`;
  await loadNews(); await loadMarkets();
}

// ── INIT ──────────────────────────────────────────────────
renderTabs(); buildCal(); updateClock();
setInterval(updateClock, 1000);
setInterval(buildCal, 60000);
loadNews();   loadMarkets();  loadSquawk();
setInterval(loadNews,    90000);
setInterval(loadMarkets, 20000);
setInterval(loadSquawk,  60000);
setInterval(()=>{ if(serverOk) loadImpact(); }, 120000);
</script>
